     This used to be two clusters — a forward shot was always struck 1.30 to
     1.95m out, a back-foot shot always 0.55 to 0.95 — with the choice almost
     dictated by the length. That makes length easy to read, and reading length
     is the whole difficulty of umpiring. It is now a continuum: every ball gets
     a commitment between "planted deep in his crease" and "stretched right out
     at it", with the length only biasing it. A good-length ball is now a genuine
     coin flip, and because the impact height falls out of how far past the pitch
     he is struck, the same delivery can be plumb or going over depending purely
     on whether he got forward. That is the judgement. */
  /* Where he's struck, measured from his own stumps. A driving batsman's front
     foot lands OUTSIDE the popping crease — about 1.8m from the stumps — so the
     pad is struck out there, not next to his back foot. It also has to stay
     behind where the ball pitched, or the ball would hit him before it lands. */
  let forward, iz, commit;
  if (lenKind === 'YORKER') {
    // a yorker beats the stride: he is reaching forward but struck on the boot
    forward = true; commit = 0.86;
    iz = clamp(pz * 0.55, 0.12, 0.70);
  } else {
    commit = clamp(COMMIT[lenKind] + gauss() * 0.30, 0.02, 0.98);
    const lo = REACH[lenKind][0], hi = REACH[lenKind][1];
    iz = clamp(lo + commit * (hi - lo), lo, Math.min(hi, pz - 0.55));
    forward = iz > 1.12;
  }

  /* HEIGHT, PROPERLY.
     The impact height used to be drawn from a table by length and the height at
     the stumps was then extrapolated from it. Those two numbers could disagree
     with each other completely: a full ball pitching 2.4m away and striking the
     pad at 33cm implies a 36-degree climb, and continuing that to the stumps put
     it 1.76m in the air. That is why full balls were sailing over and short ones
     were crashing into middle.

     Now nothing is drawn. The ball arrives at the pitch at whatever angle the
     flight actually gives it, keeps a fraction of that vertical speed off the
     surface, and everything after the bounce — the height it hits him, the
     height it reaches the stumps — is the SAME parabola sampled at two points.
     They cannot disagree, because they are the same curve.

     What falls out of it is real cricket: a yorker pitches a metre away and
     climbs 4cm, a good length climbs to the knee roll, and a short ball is at
     chest height by the time it gets to him — which is exactly why you do not
     get LBWs off short balls. */
  const bounce = rng() < 0.20 ? 'low' : rng() < 0.24 ? 'steep' : 'normal';
  const D1 = REL_Z - pz, t1 = D1 / v;
  const vyIn = (relY + 0.5 * G * t1 * t1) / D1;      // tangent of the descent
  let rest = rnd(...REST[bounce]) * B.bounceTrait;
  if (inRough) rest *= rnd(0.86, 1.14);              // worn ground: never quite true
  let crackKind = null;
  if (offCrack) {
    const shoots = rng() < 0.5;
    rest *= shoots ? rnd(0.58, 0.78) : rnd(1.16, 1.40);
    crackKind = shoots ? 'SHOT THROUGH' : 'KICKED';
  }
  rest = Math.min(rest, 0.95);                       // it cannot come up faster than it went down
  const vyOut = vyIn * rest / 0.86;                  // it also loses 14% of its pace
  const vh = v * 0.86;
  const after = s => s * vyOut - 0.5 * G * (s / vh) * (s / vh);

  const iy = Math.max(0, after(pz - iz));
  const sy = Math.max(0, after(pz - iz + iz));

  /* SIDEWAYS, AND WHY IT USED TO STRAIGHten AT THE BOUNCE.
     The line after pitching was drawn from the pitch point to a target worked
     out purely from the seam deviation — so a ball that had been curving in
     through the air suddenly set off on a flat line the moment it landed. On a
     full ball, where that happens two metres from your eye, it reads exactly as
     what it is: the ball straightening.

     A ball's sideways momentum does not vanish because it hit the ground. It
     carries on, scrubbed by the bounce, and the seam then adds or subtracts
     from it. So the lateral rate the ball has AT the pitch is measured, about
     40% survives the bounce, the seam is added to that, and everything after —
     where it strikes him, where it reaches the stumps — is that one line. An
     inswinger now keeps coming in after it lands, which is why inswinging
     yorkers hit leg stump. */
  /* Two different things were being lumped together here. The ANGLE — the plain
     straight line from a release point wide of the stumps to where it lands — is
     direction of travel, and a bounce does not scrub direction of travel: a ball
     angled across from round the wicket keeps going across after it lands. SWING
     is aerodynamic curvature, and that largely does die at the bounce. Treating
     both as swing and keeping 40% of the pair made round-the-wicket deliveries
     straighten up on landing, when the angle is the whole point of bowling from
     there. Angle now carries almost fully, swing does not, seam is added on top. */
  const angleRate = (px - B.relX) / D1;                  // straight-line direction
  const swingRate = (1.7 * swing) / D1;                  // the curved part
  /* The seam was a fixed sideways DISTANCE spread over however far it happened
     to be from the pitch to the stumps. On a yorker landing 40cm out that asked
     the ball to change direction by up to 45 degrees in the bounce, which is
     what produced the trajectories that looked wrong. Deviation is an ANGLE off
     the surface, and it is bounded: about ten degrees for a ball really ripping
     out of the rough, four and a half for a seamer nibbling one. Which also
     gives you, for free, the real reason yorkers do not turn — they run out of
     pitch before the angle can amount to anything. */
  const seamCap = type === 'spin' ? 0.176 : 0.079;       // tan 10deg / tan 4.5deg
  let seamRate = clamp(dev / Math.max(pz, 0.001), -seamCap, seamCap);
  if (offCrack) {
    /* Off the edge of a crack: three to six degrees, either way, on top of
       whatever the seam was doing — bounded so the corner at the bounce stays
       within what a ball can physically do. */
    const kick = (rng() < 0.5 ? -1 : 1) * rnd(0.052, 0.105);
    const crackCap = type === 'spin' ? 0.194 : 0.140;    // tan 11deg / tan 8deg
    seamRate = clamp(seamRate + kick, -crackCap, crackCap);
  }
  let latRate = angleRate * 0.94 + swingRate * 0.40 + seamRate;
  /* However it got there — a big inswinger dying at the bounce, seam, a kick
     off a crack — the corner the ball turns at the pitch is bounded: nine
     degrees here, so that with the small pad correction below it can never
     exceed twelve. That is the most a ball visibly does off a surface. */
  const preAngle = Math.atan(angleRate + swingRate), KINK = 9 * Math.PI / 180;
  latRate = Math.tan(clamp(Math.atan(latRate), preAngle - KINK, preAngle + KINK));

  /* If his pad cannot physically get to where this ball would strike him, bowl a
     marginally different ball rather than bending this one in flight. Two passes
     is always enough because moving the ball toward him also reduces how far he
     has to move. Everything downstream — the pitch mark, the drawn track, the
     verdict — is then one self-consistent trajectory. */
  let ix = px + latRate * (pz - iz);
  for (let pass = 0; pass < 2; pass++) {
    const res = padResidual({ ix, iy, iz, shot, forward });
    if (Math.abs(res) < 1e-4) break;
    /* Capped, so correcting for his reach can never itself put a visible corner
       in the bounce — on a yorker there is barely any pitch left to turn on. */
    latRate += clamp(-res / Math.max(pz - iz, 0.35), -0.05, 0.05);
    ix = px + latRate * (pz - iz);
  }
  const sx = px + latRate * pz;

  /* A ball 50cm outside off does not hit anybody's pad. The generator used to
     produce those anyway and the batsman was then asked to reach a point he
     physically could not, which is where the "it doesn't look like it hits him"
     cases came from. Anything he could not plausibly be struck by is rejected
     and redrawn — see buildOver. */
    /* If he shoulders arms, his pad stays where he left it — near his own stumps.
     A "no shot offered" delivery striking him 40cm outside off is not a shot he
     declined, it is a ball that missed him, and it was forcing a big positional
     correction to make the impact land. Leaves get a tighter window. */
  const reachable = Math.abs(ix - 0.13) < (shot ? 0.42 : 0.20) && iy < 1.32;

  const d = {
    reachable, inRough, bounce, offCrack, crackKind, rest,
    bowler: B, type, mph, v, lenKind, lenName: LEN_NAME[lenKind],
    pz, px, iz, ix, iy, sx, sy, dev, swing, relX: B.relX, shot, forward,
    relY, vyOut, vh
  };
  classify(d);
  return d;
}

function classify(d) {
  d.pitchedOutsideLeg = d.px > HALF_W;
  d.impactOutsideOff = d.ix < -HALF_W;

  /* No umpire's call. In real cricket it exists because ball tracking has an
     error margin — here the trajectory is known exactly, so there is no margin
     to defer to and a third outcome would only be borrowed dressing. The rule is
     the clean one: is the CENTRE of the ball inside the stumps? More than half
     the ball hitting is out, less is not. Marginal deliveries still happen and
     are still the hard ones; they just have an answer. */
  const marginX = HALF_W - Math.abs(d.sx);       // >0 means the centre is inside
  const marginY = STUMP_H - d.sy;
  const hitting = marginX > 0 && marginY > 0;
  d.margin = Math.min(marginX, marginY);         // how close it was, in metres
  d.tight = hitting ? d.margin < BALL_R : Math.max(-marginX, -marginY) < BALL_R;

  d.wickets = hitting ? 'HITTING' : (marginY <= 0 ? 'OVER THE TOP' : 'MISSING');

  const savedByLeg = d.pitchedOutsideLeg;
  const savedByOff = d.impactOutsideOff && d.shot;
  d.truth = (savedByLeg || savedByOff || !hitting) ? 'notout' : 'out';

  d.reason =
    savedByLeg ? 'Pitched outside leg stump — can never be out.' :
    savedByOff ? 'Struck outside off with a shot offered — not out.' :
    d.wickets === 'OVER THE TOP' ? (d.tight ? 'Just clearing the bails.' : 'Clearing the top of the stumps.') :
    d.wickets === 'MISSING' ? (d.tight ? 'Sliding just past the outside of the stump.' : 'Going down the side of the stumps.') :
    d.impactOutsideOff ? 'Impact outside off, but no shot offered — that does not save him.' :
    d.tight ? 'Clipping the stump. Out, but only just.' :
    'Pitched in line, struck in line, hitting the stumps.';
}

/* Each ball is physically honest, but WHICH ball you get is curated — the same
   way a real over is a bowler trying things, not a random sample of the
   universe. Without this you get an over that is 70% "not out" and therefore
   one answer six times. */
/* How often each length is out. Not flat: a short ball is out one time in
   three, a full one more often than not — the prior every real umpire carries,
   and one worth knowing, without any length being a giveaway. It averages to
   about 46% out across an over. */
const OUT_BY_LEN = { YORKER: 0.55, FULL: 0.55, GOOD: 0.48, SHORT: 0.32 };
/* The LENGTH is chosen first and the verdict found within it. Choosing a verdict
   and taking the first ball that produced it let the easy lengths do all the
   work: a quick bowler's over came out 36% yorkers, four in five of them out,
   while a good-length ball was out one time in six — so the length gave the
   answer away before the ball had pitched. Now every length carries both
   verdicts, and a yorker is a once-an-over event, as it should be. */
function buildOver(B) {
  const balls = [], recent = [];
  let yorkers = 0, cracks = 0;
  for (let n = 0; n < BALLS_PER_OVER; n++) {
    let len = pick(LEN_PICK[B.style === 'spin' ? 'spin' : 'pace']);
    if (len === 'YORKER' && yorkers >= 1) len = pick(['GOOD', 'FULL', 'SHORT']);
    let want = rng() < OUT_BY_LEN[len] ? 'out' : 'notout';
    if (recent.length >= 2 && recent[recent.length - 1] === want && recent[recent.length - 2] === want) {
      want = want === 'out' ? 'notout' : 'out';
    }
    let fallback = null, chosen = null;
    for (let i = 0; i < 400 && !chosen; i++) {
      // hold the length for most of the search; let it go only if that length
      // genuinely cannot give this verdict
      const d = makeDelivery(B, i < 300 ? len : undefined);
      if (!d.reachable) continue;
      if (d.offCrack && cracks >= 2 && i < 380) continue;   // two off the cracks in an over is plenty
      if (!fallback) fallback = d;
      if (d.truth === want) chosen = d;
    }
    if (!chosen && !fallback) fallback = makeDelivery(B);
    chosen = chosen || fallback;
    if (chosen.lenKind === 'YORKER') yorkers++;
    if (chosen.offCrack) cracks++;
    chosen.n = n + 1;
    balls.push(chosen);
    recent.push(chosen.truth);
  }
  return balls;
}

/* ---------- flight ----------
   Two segments with different speeds. The ball loses about 14% off the deck,
   and it used to travel at a constant speed all the way through because the
   animation drove distance linearly with time. Splitting the timing is what
   makes a spinner's ball visibly sit up after pitching, which is a real cue. */
function timing(d) {
  const t1 = (REL_Z - d.pz) / d.v;
  const t2 = (d.pz - d.iz) / (d.v * 0.86);
  return { t1, t2, total: t1 + t2, frac: t1 / (t1 + t2) };
}
function flightAt(d, p) {
  const T = d._t || (d._t = timing(d));
  if (p < T.frac) {
    const k = p / T.frac;                        // 0..1 through the air
    const z = REL_Z + (d.pz - REL_Z) * k;
    /* Swing is a curve, not a bulge. The old version added sin²(kπ), which
       returns to zero at both ends — the ball wobbled out and came back to the
       same straight line, which is not what swing is. Real swing means it
       leaves on one line and lands on another, with the movement stacked late:
       displacement under a steady sideways force goes with the square of time,
       so the ball barely deviates early and then goes. */
    const shape = 0.30 * k * k + 0.70 * k * k * k;
    const x = d.relX + (d.px - d.swing - d.relX) * k + d.swing * shape;
    /* Proper projectile motion. A bowler does not lob the ball — he throws it
       DOWN at the pitch from above his head, so the path is close to a straight
       line with a little sag in it. Gravity's contribution goes with time
       squared, so this sags about 8cm at 90mph and 27cm at 48mph: the
       difference between pace and spin falls out of the physics instead of
       being drawn on by hand. */
    const y = d.relY * (1 - k) + 0.5 * G * T.t1 * T.t1 * k * (1 - k);
    return [x, Math.max(y, 0), z];
  }
  const k = (p - T.frac) / (1 - T.frac);         // 0..1 after pitching
  const z = d.pz + (d.iz - d.pz) * k;
  const x = d.px + (d.ix - d.px) * k;
  /* The same parabola the height was solved on, so what you watch and what you
     are judged against are one curve. */
  const s = (d.pz - d.iz) * k;
  const y = Math.max(0, s * d.vyOut - 0.5 * G * (s / d.vh) * (s / d.vh));
  return [x, y, z];
}
/* The Hawk-Eye continuation. This is the same parabola the ball is flying on,
   sampled past the pad — not a straight line drawn between two computed points.
   It is the line people will freeze-frame, so it has to BE the trajectory. */
function pathToStumps(d) {
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const z = d.iz * (1 - i / 12);
    const s = d.pz - z;
    pts.push(new THREE.Vector3(
      d.px + (d.ix - d.px) * (s / Math.max(d.pz - d.iz, 1e-9)),
      Math.max(0, s * d.vyOut - 0.5 * G * (s / d.vh) * (s / d.vh)),
      z
    ));
  }
  return pts;
}

/* ---------- game state ---------- */
let BOWLER = makeBowler();
let over = buildOver(BOWLER);
let ballIdx = 0;
let results = [];
let d = null, phase = 'idle', t0 = 0, call = null, raf = 0;
let appealLeft = 0, lastNow = 0;
const APPEAL_MS = 3000;
const E = id => document.getElementById(id);

function setPhase(p) {
  phase = p;
  E('bowl').style.display = (p === 'idle') ? 'block' : 'none';
  E('lbBtn').style.display = (p === 'idle' && lbEnabled()) ? 'block' : 'none';
  E('decide').style.display = (p === 'appeal') ? 'grid' : 'none';
  E('next').style.display = (p === 'verdict') ? 'block' : 'none';
  E('timer').style.display = (p === 'appeal') ? 'block' : 'none';
  E('panel').style.display = (p === 'verdict') ? 'block' : 'none';
  E('summary').style.display = (p === 'over') ? 'block' : 'none';
}

function paintScore() {
  E('count').textContent = 'BALL ' + Math.min(ballIdx + 1, BALLS_PER_OVER) + ' / ' + BALLS_PER_OVER;
  E('pips').innerHTML = over.map((_, i) => {
    const r = results[i];
    const cls = r === undefined ? 'p' : r === 'right' ? 'p ok' : 'p no';
    return '<i class="' + cls + '"></i>';
  }).join('');
}

/* The run-up. The batsman's trigger movement happens BEFORE the ball is
   released, not during its flight — cramming it into the flight was what made
   the movement unreadable. It also gives you a beat to settle, and the pace of
   the approach is a cue in itself. */
function runupMs(d) { return d.type === 'fast' ? 820 : d.type === 'medium' ? 780 : 700; }

function bowl() {
  d = over[ballIdx];
  d._t = null;
  setFieldFor(d.type);
  placeBatter(d);

  clearTrack();
  resetCamera();
  call = null;
  E('readout').textContent = '';
  ball.visible = false; ballShadow.visible = false;
  impactRing.visible = false;
  trailPts = []; trail.visible = false;
  t0 = performance.now();
  setPhase('runup');
}

let impactAt = 0, deflect = null;
function onImpact() {
  impactAt = performance.now();
  const stride = d.lenKind === 'YORKER' ? 'ON THE BOOT'
               : d.iz > 1.55 ? 'WELL FORWARD' : d.iz > 1.12 ? 'FORWARD'
               : d.iz > 0.78 ? 'ON THE CREASE' : 'BACK';
  /* The bounce tag reads the bounce that actually happened, crack and rough
     included, not the category the ball was drawn from. */
  const bounceTag = d.offCrack ? ' · OFF A CRACK · ' + d.crackKind
                  : d.lenKind === 'YORKER' ? ''             // a yorker has no bounce to speak of
                  : d.rest < 0.47 ? ' · KEPT LOW' : d.rest > 0.70 ? ' · EXTRA BOUNCE' : '';
  E('readout').textContent = d.mph + ' MPH · ' + d.lenName + ' · ' + stride +
    (d.inRough ? ' · OUT OF THE ROUGH' : '') + bounceTag;
  appealLeft = APPEAL_MS;
  /* The ball has to visibly stop ON him. It used to freeze at the notional
     impact point, which from the umpire's end can look like it sailed past.
     Now it dies against the pad and drops away, which is what tells you the
     contact happened at all. */
  deflect = {
    p: new THREE.Vector3(d.ix, d.iy, d.iz),
    v: new THREE.Vector3((d.ix < 0 ? -1 : 1) * rnd(0.7, 1.8), rnd(0.4, 1.3), rnd(1.1, 2.4)),
    t: impactAt
  };
  impactRing.position.set(d.ix, d.iy, d.iz + 0.03);
  impactRing.visible = true;
  setPhase('appeal');
}

function decide(c) {
  if (phase !== 'appeal') return;
  call = c;
  t0 = performance.now();
  drawTrack();
  setPhase('replay');
}

function finish() {
  const correct = call === d.truth;
  results[ballIdx] = correct ? 'right' : 'wrong';
  const words = { out: 'OUT', notout: 'NOT OUT' };
  E('verdict').textContent = words[d.truth];
  E('verdict').className = 'v ' + d.truth;
  E('yours').textContent =
    call === null ? 'No decision — that goes down as not out.' :
    (correct ? '✓ Correct' : '✗ Wrong') + (d.tight ? ' · that was a whisker' : '');
  E('yours').style.color = correct ? '#3ad17f' : '#ff6a5d';
  E('why').textContent = d.reason;
  E('boxes').innerHTML =
    box('PITCHING', d.pitchedOutsideLeg ? 'OUTSIDE LEG' : (d.px < -HALF_W ? 'OUTSIDE OFF' : 'IN LINE'), d.pitchedOutsideLeg ? 'g' : 'r') +
    box('IMPACT', d.impactOutsideOff ? 'OUTSIDE OFF' : 'IN LINE', (d.impactOutsideOff && d.shot) ? 'g' : 'r') +
    box('WICKETS', d.wickets, d.wickets === 'HITTING' ? 'r' : 'g');
  E('next').textContent = ballIdx >= BALLS_PER_OVER - 1 ? '▶ End of over' : '▶ Next ball';
  paintScore();
  setPhase('verdict');
}
const box = (l, v, c) => '<div class="bx"><span>' + l + '</span><b class="' + c + '">' + v + '</b></div>';

const FACE = { right: '🟩', wrong: '🟥' };
function endOver() {
  const right = results.filter(r => r === 'right').length;
  E('score').textContent = right + '/' + BALLS_PER_OVER;
  E('scoreSub').textContent =
    right === 6 ? 'A perfect over. Elite panel stuff.' :
    right >= 5 ? 'That is an international standard over.' :
    right >= 3 ? 'Solid. A couple you will want back.' :
                 'Long afternoon in the middle.' ;
  E('grid').textContent = results.map(r => FACE[r] || '⬛').join('');
  E('bowlerOut').textContent = BOWLER.label;
  const grid = results.map(r => FACE[r] || '⬛').join('');
  shareText = 'Over & Out — ' + SEED_KEY + '\n' + grid + '  ' + right + '/' + BALLS_PER_OVER + '\noverandoutgame.com';
  setPhase('over');
  lbOnOverEnd(right, grid, BOWLER.label);
}
let shareText = '';
function doShare() {
  const done = ok => {
    E('share').textContent = ok ? '✓ Copied' : 'Copy failed';
    setTimeout(() => { E('share').textContent = 'Share your over'; }, 1800);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(() => done(true), () => done(false));
      return;
    }
  } catch (e) { /* falls through */ }
  // artifact frames can block the clipboard entirely; show the text instead
  E('shareBox').textContent = shareText;
  E('shareBox').style.display = 'block';
}

function clearTrack() {
  for (const m of marks) { scene.remove(m); if (m.geometry) m.geometry.dispose(); }
  marks = [];
  trackLine = predLine = null;
  for (const s of stumpsNear.parts) s.material.color.set(0xefe6cf);
}

/* A THREE.Line is one pixel wide on almost every browser no matter what you
   ask for, and this line is the entire payoff of the replay — so it's built
   as real geometry instead. */
function tube(points, color, radius) {
  const curve = new THREE.CatmullRomCurve3(points);
  const m = new THREE.Mesh(
    new THREE.TubeGeometry(curve, Math.min(120, points.length * 3), radius, 7, false),
    new THREE.MeshBasicMaterial({ color })
  );
  scene.add(m);
  marks.push(m);
  return m;
}

function drawTrack() {
  const pts = [];
  for (let i = 0; i <= 44; i++) pts.push(new THREE.Vector3(...flightAt(d, i / 44)));
  trackLine = tube(pts, 0xf4f8fa, 0.026);

  // the predicted continuation, drawn as dashes so it reads as a prediction
  const p2 = pathToStumps(d);
  for (let i = 0; i < 12; i += 2) {
    predLine = tube([p2[i], p2[i + 1]], 0xffd23f, 0.032);
  }

  const mark = (x, y, z, col, r) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), new THREE.MeshBasicMaterial({ color: col }));
    m.position.set(x, y, z); scene.add(m); marks.push(m); return m;
  };
  mark(d.px, 0.012, d.pz, 0xffb12e, 0.05);         // where it pitched
  mark(d.ix, d.iy, d.iz, 0xffffff, 0.045);          // where it struck him

  if (d.wickets === 'HITTING') for (const s of stumpsNear.parts) s.material.color.set(0xff5a4d);
}

/* The replay has to fit a tall, narrow phone screen, which is the wrong shape
   for a 20-metre pitch. An eleven-metre trajectory and a readable set of stumps
   will not fit on the same screen at the same time, so the replay does what
   television does: a wide pass showing the whole ball, then a push in on the
   wicket. */
function replayCamera(e) {
  const s = smooth(clamp(e / 0.42, 0, 1));          // umpire -> wide
  const t = smooth(clamp((e - 0.60) / 0.40, 0, 1)); // wide -> tight on the stumps

  const wAz = 0.32, wR = 7 + d.pz * 1.4, wY = 3.0 + d.pz * 0.15, wAim = d.pz * 0.6;
  let az = lerp(0, wAz, s), r = lerp(UMP_Z, wR, s), y = lerp(UMP_Y, wY, s);
  let aim = lerp(0, wAim, s), fov = lerp(FOV, 40, s);

  az = lerp(az, 0.46, t); r = lerp(r, 3.6, t); y = lerp(y, 1.35, t);
  aim = lerp(aim, 0.30, t); fov = lerp(fov, 34, t);

  camera.fov = fov;
  camera.updateProjectionMatrix();
  camera.position.set(-Math.sin(az) * r, y, Math.cos(az) * r);
  camera.lookAt(0, lerp(0.74, 0.48, s), aim);
  camera.updateMatrixWorld(true);
}

/* ---------- loop ---------- */
function frame(now) {
  raf = requestAnimationFrame(frame);
  const w = innerWidth, h = innerHeight;
  if (w !== W || h !== H) { W = w; H = h; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }

  fieldIdle(now / 1000);
  for (const s of shadows) {
    s.mesh.visible = s.fig.group.visible;
    // the sun is up and to the off side, so the shadow falls the other way
    s.mesh.position.set(s.fig.ox + 0.16, 0.014, s.fig.oz - 0.10);
  }
  if (phase === 'runup') {
    const r = clamp((now - t0) / runupMs(d), 0, 1);
    batterRunup(d, r);
    if (r >= 1) {
      ball.visible = true; ballShadow.visible = true;
      t0 = now;
      setPhase('flight');
    }
  } else if (phase === 'flight') {
    const dur = (d._t || (d._t = timing(d))).total * 1000;   // real time, no padding
    const p = clamp((now - t0) / dur, 0, 1);
    const [x, y, z] = flightAt(d, p);
    batterPose(d, p);
    ball.position.set(x, y, z);
    ballShadow.position.set(x, 0.006, z);
    ballShadow.scale.setScalar(1 + y * 0.5);
    ballShadow.material.opacity = 0.38 / (1 + y * 1.4);
    // trail is time-based, not frame-based: on a slow device a frame-counted
    // trail stretches the whole length of the pitch
    trailPts.push({ v: new THREE.Vector3(x, y, z), t: now });
    while (trailPts.length > 2 && now - trailPts[0].t > 110) trailPts.shift();
    if (trailPts.length > 1) {
      trail.geometry.setFromPoints(trailPts.map(o => o.v));
      trail.visible = true;
    }
    if (p >= 1) onImpact();
  } else if (phase === 'appeal') {
    // he doesn't stop dead on the ball — the follow-through plays out while
    // you're making up your mind
    batterPose(d, 1 + clamp((now - impactAt) / 950, 0, 1) * 0.95);
    stepDeflect(now);
    /* The clock runs on frames, capped: on a phone that is struggling to draw
       this scene the three seconds should not disappear between two frames
       while the player is still looking at the impact. */
    appealLeft -= Math.min(now - lastNow, 60);
    E('bar').style.width = (Math.max(0, appealLeft) / APPEAL_MS * 100) + '%';
    if (appealLeft <= 0) { call = null; t0 = now; drawTrack(); setPhase('replay'); }
  } else if (phase === 'replay') {
    const p = clamp((now - t0) / 3400, 0, 1);
    replayCamera(p);
    // Hawk-Eye ghosts the batter away for the "would it have hit" shot, and so
    // do we — from three metres he stands directly between you and the stumps.
    batter.group.visible = p < 0.60;
    ball.position.set(d.ix, d.iy, d.iz);
    ballShadow.visible = false; trail.visible = false; impactRing.visible = false;
    if (p >= 1) finish();
  }
  renderer.render(scene, camera);
  lastNow = now;
}

/* The ball dropping off the pad, and the flash at the moment it lands. Neither
   changes a single decision — they exist so that the contact is unmistakable. */
function stepDeflect(now) {
  if (!deflect) return;
  const e = (now - deflect.t) / 1000;
  if (e > 2.4) { ball.visible = false; return; }
  deflect.v.y -= G * (1 / 60);
  deflect.p.addScaledVector(deflect.v, 1 / 60);
  if (deflect.p.y < BALL_R) { deflect.p.y = BALL_R; deflect.v.y *= -0.32; deflect.v.multiplyScalar(0.72); }
  ball.position.copy(deflect.p);
  ballShadow.position.set(deflect.p.x, 0.006, deflect.p.z);
  ballShadow.scale.setScalar(1 + deflect.p.y * 0.5);
  const f = clamp(e / 0.26, 0, 1);
  impactRing.visible = f < 1;
  impactRing.scale.setScalar(1 + f * 4.5);
  impactRing.material.opacity = 0.85 * (1 - f);
  impactRing.lookAt(camera.position);
}

/* ---------- wire up ---------- */
makeScene();
stance();
setFieldFor(BOWLER.style);
E('bowlerBar').textContent = BOWLER.label;
paintScore();
setPhase('idle');

E('bowl').onclick = bowl;
E('next').onclick = () => {
  ball.visible = false; ballShadow.visible = false; trail.visible = false;
  impactRing.visible = false; deflect = null;
  clearTrack(); resetCamera(); E('readout').textContent = '';
  batter.group.visible = true;
  batter.ox = GROUP_X; batter.oz = GROUP_Z;
  stance();
  ballIdx++;
  if (ballIdx >= BALLS_PER_OVER) { endOver(); return; }
  paintScore();
  setPhase('idle');
};
E('again').onclick = () => {
  // a fresh over off the same day's seed, so the shareable one stays the day's
  practice = true;
  rng = mulberry32(hashStr('over-and-out:' + SEED_KEY + ':' + Date.now()));
  /* Practice overs cycle the bowler rather than rolling the dice: play three in
     a row and you have seen pace, medium and spin, instead of three spinners. */
  const was = BOWLER.style;
  let tries = 0;
  do { BOWLER = makeBowler(); } while (BOWLER.style === was && ++tries < 30);
  over = buildOver(BOWLER);
  ballIdx = 0; results = [];
  E('bowlerBar').textContent = BOWLER.label;
  E('shareBox').style.display = 'none';
  setFieldFor(BOWLER.style);
  batter.ox = GROUP_X; batter.oz = GROUP_Z; stance();
  resetCamera(); clearTrack(); paintScore();
  setPhase('idle');
};
E('share').onclick = doShare;
E('lbBtn').onclick = () => lbOpen('today');
E('bClose').onclick = lbClose;
E('bTabToday').onclick = () => lbOpen('today');
E('bTabMonth').onclick = () => lbOpen('month');
lbInit();
E('out').onclick = () => decide('out');
E('not').onclick = () => decide('notout');
addEventListener('keydown', e => {
  if (e.key === 'o') decide('out');
  else if (e.key === 'n') decide('notout');
  else if (e.key === ' ') {
    if (phase === 'idle') bowl();
    else if (phase === 'verdict') E('next').click();
  }
});
requestAnimationFrame(frame);
</script>
