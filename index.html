<script>/* ============================================================
   THE FIGURES — one Blender model, driven by the game's own rig

   The body is a single skinned mesh built in Blender; the pads,
   gloves, helmet and bat are rigid pieces bound to individual
   bones. All of it is driven by a keyframe bank and a small IK
   solver rather than by baked animation, so a pose can be aimed
   at a point computed at runtime — which is the whole trick that
   lets the batsman's pad meet the actual ball.

   The same model is parsed more than once to make the wicket-
   keeper and the slips. Parsing is cheap next to the alternative
   (bundling SkeletonUtils to deep-clone a skinned mesh), and it
   gives each figure a genuinely independent skeleton.

   The model exports from Blender in the game's own axes — Y up,
   +Z toward the bowler, +X to the leg side — so nothing needs
   converting here.
   ============================================================ */

/* Bone lengths measured off the exported model, not guessed.
   Second model (MPFB body, 1.80m): longer legs (0.90m hip to ankle rather
   than 0.84), a longer torso, slightly shorter arms, broader shoulders. */
const BONE = {
  pelvis: 0.141, spine: 0.192, chest: 0.152, neck: 0.110, head: 0.211,
  shoulder: 0.199, upper_arm: 0.264, forearm: 0.276, hand: 0.116,
  thigh: 0.446, shin: 0.451, foot: 0.147,
  hipHalf: 0.112, shHalf: 0.199
};
const LEG_REACH = BONE.thigh + BONE.shin;
/* The ankle joint sits 7.1cm above the sole of the boot on this body, so a
   foot target of y=0.071 is a boot flat on the grass. The keyframes below are
   written at that height. */
const ANKLE_H = 0.071;
/* The foot bone runs from the ankle down to the ball of the foot, not flat
   along the ground: in the rest pose it drops 0.45 for every 0.89 forward.
   Point it flat and the whole boot rocks back onto its heel. */
const footDir = (hx, hz) => { const n = Math.hypot(hx, hz) || 1; return new THREE.Vector3(hx / n * 0.893, -0.450, hz / n * 0.893); };
const D2R = Math.PI / 180;
const CHEST_LEAN = Math.tan(12 * D2R);   // about half the rest lean: all of it pushed the head out over the off side
/* Where the batsman stands. He was 15cm too far to the leg side, so the stumps
   sat clear of him instead of being covered by his pads. The stride clamps in
   dynamicPoses() are expressed relative to this, so moving him does not move
   the absolute points on the pitch his front foot can reach. */
const GROUP_X = 0.13, GROUP_Z = 1.05;

/* ---------- keyframes ---------- */
const K = {
  /* Rebuilt against three references from the bowler's end (Kohli, Richards,
     and a coaching still) plus one round of Pat's own notes.

     hipYaw is how far ROUND he is: 90 is fully side-on, 0 is chest square to
     the bowler. It sat at 44 — half open — while the feet were a shoulder-width
     apart along the crease, and those two do not go together: at 44 the leading
     hip swings out to the leg side while its own foot is still over on the off
     side, so the front leg has to angle across the back one. That was the
     crossed-legs look. 80 puts the hip line down the pitch, and each leg then
     splays gently outward from under its own hip.

     Feet are also closer together than they were (0.25m rather than 0.33m),
     which is what a real stance looks like and keeps the knees flexed rather
     than propping him up on straight legs. */
  /* Feet NARROWER and split down the pitch rather than across it. At 0.25m
     apart across the crease you saw two separate pads side by side with daylight
     between them, which is the one thing that never happens in a real stance —
     from the bowler's end you see the front pad and, at most, a sliver of the
     back one behind it. 0.18m across and 0.14m of depth puts the back leg
     behind the front where it belongs.

     The bat is also up off the ground now. Planted, it read as a man leaning on
     it; lifted, the toe about 10cm clear and angled back toward the slips, he
     reads as a batsman who is ready — and it gives the backlift somewhere to
     start from rather than beginning at zero.

     Worth knowing if you tune batEl: the bat is 0.90m long from the wrist, not
     the 0.65m its rest-pose bounding box suggests, so anything below about 38
     degrees buries the toe in the pitch. It had been sunk 10cm into the ground
     in the stance and 22cm at the moment of contact, hidden behind the pads. */
  /* Hips and shoulders now go OPPOSITE ways, which is what a real address looks
     like and what fixes both halves of the same complaint. Hips at 86 are almost
     fully side-on, so the back pad disappears behind the front one. Shoulders at
     minus 22 relative to them — 64 absolute — turn the chest back toward the
     umpire, so you see his shoulder width and the front of his shirt instead of
     a narrow edge. Before, the shoulders were rotated FURTHER round than the
     hips, which is the wrong way and gave both the visible back pad and the
     thin, edge-on torso. */
  /* Rebuilt a third time, against a square-on photograph of Rahul at address.
     Five things separated it from the real thing, and all five are here:

     FEET nearly in line. His two boots sit within a boot-width of each other
     across the pitch, with the stagger running DOWN the pitch instead. 6cm
     across and 20cm deep, where it was 15 and 16. That lateral gap was what put
     daylight between the two pads; closed up, they read as one shape with a
     sliver of the back pad behind, which is what you actually see.

     HINGE. He is bent 33 degrees at the hips with his backside pushed out
     behind him. At 22 ours read as a man standing up holding a bat. This is the
     single biggest difference between the two pictures.

     HEAD FORWARD. His chin is out over his front foot, not stacked above his
     hips. The head direction used to be 78% vertical — deliberately, so it
     would not tip about — and that was working against the whole shape.

     HANDS DOWN AND IN. Mid-thigh, tucked close to the front hip, forearms
     nearly vertical.

     BAT ON THE GROUND at rest. The lift you wanted now happens through the
     run-up, which is when it happens in life, rather than being held up before
     the bowler has moved. */
  /* A HINGE, NOT A STOOP — the distinction that took three passes to see.
     Rotating the spine 33 degrees while leaving the pelvis roughly under him
     curled his back over like a question mark and dropped his chin onto his
     chest. Rahul's back is a straight line at an angle, and the thing that lets
     it stay straight is his backside being pushed out BEHIND him as the
     counterweight. So the pelvis goes back 5cm further and the spine angle comes
     down to 27: the hips take the bend, the back stops curling.

     The bat and the hands are one problem, not two. Dropping the hands to
     mid-thigh forced the bat to rake out to 44 degrees just to reach the ground,
     which from square looks like a man leaning on a walking stick. Rahul's
     gloves are nearer hip height — level with the top of the pad — and his bat
     hangs close to vertical. Hands back up to 0.80 and the bat comes in to 27,
     and now both are right at once. */
  /* Two last things off the photograph.

     MORE BUM OUT. The hinge was there but the pelvis was barely behind his
     heels, so the shape read as a lean rather than a sit-back. Pelvis goes back
     another 5cm and the spine angle up to 31, which puts his backside about
     14cm behind the heel of his back foot and his shoulders 23cm in front of
     his hips — the counterweighted shape rather than a topple.

     BACK LEG HIDDEN. The two feet were 6cm apart across the pitch, which sounds
     like nothing until you work out what it does on screen: at twenty metres the
     pad is 28 pixels wide and the offset was 10 of them, so a third of the back
     pad stuck out. They are now aligned for the CAMERA rather than on paper —
     the back foot sits fractionally to the off, because it is 20cm further away
     and perspective would otherwise swing it out to the leg side. From the
     umpire's end the back leg now sits directly behind the front one. */
  stance:   { pelvis: [-0.010, 0.814, -0.215], hipYaw: 86, shYaw: -22, tilt: 31, side: -4,
              backFoot: [-0.020, 0.071, -0.118], frontFoot: [-0.034, 0.071, 0.082],
              grip: [-0.112, 0.925, 0.074], batEl: 24, batAz: 202 },
  trigger:  { pelvis: [0.010, 0.812, -0.234], hipYaw: 88, shYaw: -20, tilt: 32, side: -1,
              backFoot: [-0.004, 0.073, -0.142], frontFoot: [-0.030, 0.075, 0.070],
              grip: [-0.096, 0.979, 0.068], batEl: 54, batAz: 206 },
  backlift: { pelvis: [0.016, 0.818, -0.240], hipYaw: 90, shYaw: -14, tilt: 32, side: 1,
              backFoot: [0.000, 0.073, -0.142], frontFoot: [-0.028, 0.077, 0.072],
              grip: [-0.008, 1.081, -0.046], batEl: 118, batAz: 206 },
  top:      { pelvis: [0.020, 0.823, -0.246], hipYaw: 88, shYaw: -8, tilt: 31, side: 2,
              backFoot: [0.004, 0.073, -0.146], frontFoot: [-0.024, 0.111, 0.100],
              grip: [0.018, 1.144, -0.074], batEl: 148, batAz: 208 },
  raise:    { pelvis: [0.034, 0.851, -0.226], hipYaw: 84, shYaw: -12, tilt: 25, side: 4,
              backFoot: [0.042, 0.073, -0.150], frontFoot: [-0.048, 0.073, 0.034],
              grip: [-0.050, 1.250, -0.010], batEl: 158, batAz: 236 },
  raised:   { pelvis: [0.046, 0.868, -0.238], hipYaw: 80, shYaw: -10, tilt: 22, side: 6,
              backFoot: [0.050, 0.073, -0.168], frontFoot: [-0.042, 0.073, 0.016],
              grip: [-0.105, 1.340, 0.000], batEl: 170, batAz: 250 },
  /* He does not hold the end of his shot for three seconds while you decide.
     Whatever shape the follow-through ended in, he stands up out of it, drops
     the bat back to the ground and turns to look at the umpire — which is
     exactly what a batsman does during an appeal. This is what stops the odd
     ugly follow-through being the thing you stare at. */
  settle:   { pelvis: [0.002, 0.857, -0.186], hipYaw: 82, shYaw: -18, tilt: 24, side: 0,
              backFoot: [-0.012, 0.071, -0.124], frontFoot: [-0.036, 0.071, 0.086],
              grip: [-0.132, 0.954, 0.054], batEl: 21, batAz: 198 }
};

/* The keeper and the slips are the same model in a different shape. They face
   straight back up the pitch, so hipYaw 0 — square on to the bowler, which from
   the umpire's camera means we see their fronts. */
/* Legs wide, knees bent, bent well over from the hips, and — the thing that
   was wrong before — hands OUT on the knees or cupped low in front, elbows
   out. With both gloves at one point in front of the hips they looked like men
   who needed the toilet. The head is lifted to watch the batsman. */
const FIELD_ARMS = { armPoleL: [1, -0.25, 0.30], armPoleR: [-1, -0.25, 0.30],
                     legPoleL: [0.55, 0, 1], legPoleR: [-0.55, 0, 1], headUp: 0.88 };
const FIELD = {
  keeperUp:  Object.assign({ pelvis: [0.000, 0.520, -0.050], hipYaw: 0, shYaw: 0, tilt: 55, side: 0,
              backFoot: [-0.340, ANKLE_H, 0.020], frontFoot: [0.340, ANKLE_H, 0.020],
              grip: [0.000, 0.280, 0.340], gripL: [0.085, 0.280, 0.340], gripR: [-0.085, 0.280, 0.340],
              batEl: 40, batAz: 0 }, FIELD_ARMS),
  keeperBack:Object.assign({ pelvis: [0.000, 0.660, -0.050], hipYaw: 0, shYaw: 0, tilt: 62, side: 0,
              backFoot: [-0.330, ANKLE_H, 0.020], frontFoot: [0.330, ANKLE_H, 0.020],
              grip: [0.000, 0.380, 0.360], gripL: [0.100, 0.380, 0.360], gripR: [-0.100, 0.380, 0.360],
              batEl: 40, batAz: 0 }, FIELD_ARMS),
  slip:      Object.assign({ pelvis: [0.000, 0.800, -0.040], hipYaw: 0, shYaw: 3, tilt: 58, side: 0,
              backFoot: [-0.310, ANKLE_H, 0.020], frontFoot: [0.310, ANKLE_H, 0.020],
              grip: [0.000, 0.500, 0.150], handsOnKnees: true,
              batEl: 35, batAz: 0 }, FIELD_ARMS)
};
/* A slip's hands rest on his knees, and where the knees are is the solver's
   business — so the pose is solved once for the legs and the hands are put on
   what it found. */
function handsOnKnees(S) {
  if (!S.handsOnKnees) return S;
  const J = solveSkeleton(Object.assign({}, S, { gripL: undefined, gripR: undefined }));
  return Object.assign({}, S, {
    gripL: [J.legL.mid.x + 0.020, J.legL.mid.y + 0.045, J.legL.mid.z + 0.085],
    gripR: [J.legR.mid.x - 0.020, J.legR.mid.y + 0.045, J.legR.mid.z + 0.085]
  });
}


function dynamicPoses(d) {
  const fwd = d.forward;
  const rawX = d.ix - GROUP_X, rawZ = d.iz - GROUP_Z;
  /* A yorker beats the front foot and strikes low behind it, so steering the
     front leg onto that impact would drag him backwards mid-stride. */
  const onFrontPad = fwd ? rawZ > 0.15 : true;
  const lx = onFrontPad ? clamp(rawX, -0.52, 0.29) : -0.14;
  const lz = onFrontPad ? clamp(rawZ, -0.45, 0.62) : 0.36;
  const footX = lx - 0.045, footZ = lz + (fwd ? 0.120 : 0.010);

  /* Two things made the shot look like his legs cross. The hips snapped almost
     square (34) while the front foot went out to the off, so the leading hip
     ended up on the far side of its own foot; and the stride was clamped so
     short that the front leg travelled sideways instead of down the pitch.
     Opening only to ~52, letting the hips TRAVEL forward with the stride and
     dropping them into the lunge fixes both — a long stride reads as a stride,
     a short one reads as a tangle. */
  const contact = fwd ? {
    pelvis: [0.030, 0.829, lz * 0.72 - 0.020], hipYaw: 52, shYaw: 8, tilt: 26, side: -4,
    backFoot: [0.210, 0.141, -0.080], frontFoot: [footX, ANKLE_H, footZ],
    grip: [lx + 0.030, 0.884, lz + 0.127], batEl: 32, batAz: 356
  } : {
    pelvis: [0.055, 0.885, -0.165], hipYaw: 74, shYaw: 9, tilt: 18, side: 2,
    backFoot: [0.128, ANKLE_H, -0.215], frontFoot: [footX, ANKLE_H, footZ],
    grip: [lx - 0.150, 1.033, lz + 0.042], batEl: 22, batAz: 352
  };

  const T = K.top;
  const mixv = (a, b, f) => [lerp(a[0], b[0], f[0]), lerp(a[1], b[1], f[1]), lerp(a[2], b[2], f[2])];
  const stride = {
    pelvis: mixv(T.pelvis, contact.pelvis, [0.75, 0.72, 0.85]),
    hipYaw: lerp(T.hipYaw, contact.hipYaw, 0.55),   // hips lead
    shYaw:  lerp(T.shYaw, contact.shYaw, 0.15),     // shoulders lag: the coil
    tilt:   lerp(T.tilt, contact.tilt, 0.70),
    side:   lerp(T.side, contact.side, 0.60),
    backFoot: [lerp(T.backFoot[0], contact.backFoot[0], 0.6), ANKLE_H + 0.012,
               lerp(T.backFoot[2], contact.backFoot[2], 0.6)],
    frontFoot: contact.frontFoot.slice(),           // foot down early
    grip:   mixv(T.grip, contact.grip, [0.30, 0.22, 0.30]),
    batEl:  lerp(T.batEl, contact.batEl, 0.20),
    batAz:  lerp(T.batAz, contact.batAz, 0.30)
  };
  /* The follow-through. This used to stand him bolt upright with the bat swung
     out to 60-72 degrees, which from behind reads as a man holding a plank flat
     across his chest waiting for a bus. A defensive shot has almost no
     follow-through: the bat stops, the body stays down over it, and the blade
     comes up only a little and stays close to vertical. So this is now a small
     continuation of the contact pose rather than a different pose. */
  const through = fwd ? {
    pelvis: [contact.pelvis[0] - 0.012, contact.pelvis[1] + 0.018, contact.pelvis[2] + 0.030],
    hipYaw: 48, shYaw: 4, tilt: 24, side: -5,
    backFoot: [contact.backFoot[0] - 0.015, 0.166, contact.backFoot[2] + 0.025],
    frontFoot: contact.frontFoot.slice(),
    grip: [contact.grip[0] - 0.070, 1.024, contact.grip[2] + 0.050],
    batEl: 34, batAz: 6
  } : {
    pelvis: [contact.pelvis[0], contact.pelvis[1] + 0.004, contact.pelvis[2] - 0.010],
    hipYaw: 70, shYaw: 10, tilt: 17, side: 3,
    backFoot: contact.backFoot.slice(), frontFoot: contact.frontFoot.slice(),
    grip: [contact.grip[0] - 0.030, 1.073, contact.grip[2] + 0.020],
    batEl: 20, batAz: 358
  };
  return { stride, contact, through };
}

const SEG_RUN   = [['stance', 'stance', 0, 0.30], ['stance', 'trigger', 0.30, 0.70],
                   ['trigger', 'backlift', 0.70, 1]];
const SEG_SHOT  = [['backlift', 'top', 0, 0.20], ['top', 'stride', 0.20, 0.64],
                   ['stride', 'contact', 0.64, 1], ['contact', 'through', 1, 1.30],
                   ['through', 'settle', 1.30, 1.95]];
const SEG_LEAVE = [['backlift', 'top', 0, 0.22], ['top', 'raise', 0.22, 0.60],
                   ['raise', 'raised', 0.60, 1], ['raised', 'raised', 1, 1.30],
                   ['raised', 'settle', 1.30, 1.95]];

const V3 = ['pelvis', 'backFoot', 'frontFoot', 'grip'];
const NUM = ['hipYaw', 'shYaw', 'tilt', 'side', 'batEl', 'batAz'];
function mixK(a, b, t) {
  const o = {};
  for (const k of V3) o[k] = [lerp(a[k][0], b[k][0], t), lerp(a[k][1], b[k][1], t), lerp(a[k][2], b[k][2], t)];
  for (const k of NUM) o[k] = lerp(a[k], b[k], t);
  return o;
}
function walk(segs, bank, p) {
  for (const [from, to, s0, s1] of segs) {
    if (p >= s0 && p <= s1) return mixK(bank[from], bank[to], smooth(clamp((p - s0) / (s1 - s0), 0, 1)));
  }
  return bank[segs[segs.length - 1][1]];
}

/* ---------- solver ---------- */
const _v = () => new THREE.Vector3();
function ik2(root, target, l1, l2, pole) {
  const d = _v().subVectors(target, root);
  const dist = d.length() || 1e-4;
  const ax = d.clone().divideScalar(dist);
  const dc = clamp(dist, Math.abs(l1 - l2) + 1e-3, l1 + l2 - 1e-3);
  const a = (l1 * l1 - l2 * l2 + dc * dc) / (2 * dc);
  const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
  const p = pole.clone().addScaledVector(ax, -pole.dot(ax));
  if (p.lengthSq() < 1e-8) p.set(0, 0, 1);
  p.normalize();
  return {
    mid: root.clone().addScaledVector(ax, a).addScaledVector(p, h),
    end: root.clone().addScaledVector(ax, dc)
  };
}
const lateral = deg => new THREE.Vector3(Math.cos(deg * D2R), 0, Math.sin(deg * D2R));

function solveSkeleton(S) {
  const hipAx = lateral(S.hipYaw);
  const shAx  = lateral(S.hipYaw + S.shYaw);
  const t = S.tilt * D2R, sd = S.side * D2R;
  const spine = new THREE.Vector3(Math.sin(sd), Math.cos(t) * Math.cos(sd), Math.sin(t)).normalize();
  const P = new THREE.Vector3(...S.pelvis);
  const chestJ = P.clone().addScaledVector(spine, BONE.pelvis + BONE.spine);
  /* The upper back is not a straight continuation of the lower: on this body
     the chest bone leans 23 degrees forward of the spine in its rest pose.
     Forcing it straight rotated the whole upper torso backwards — round
     shoulders, a puffed chest and the neck swallowed by the collar. So the
     chest keeps its natural lean, in whichever direction the chest is
     facing. */
  const chestFwd = new THREE.Vector3(-shAx.z, 0, shAx.x);
  const chestDir = spine.clone().addScaledVector(chestFwd, CHEST_LEAN).normalize();
  const shC = chestJ.clone().addScaledVector(chestDir, BONE.chest);
  /* The head follows the spine much more than it used to. It was 78% vertical
     so it would stay level whatever the body did, which kept his chin stacked
     over his hips — and a batsman's head is out in FRONT of him, over the front
     foot, looking down the pitch. Still damped rather than fully locked to the
     spine, so it does not swing about during the shot. */
  const headUp = S.headUp === undefined ? 0.60 : S.headUp;
  const headDir = spine.clone().multiplyScalar(1 - headUp).addScaledVector(new THREE.Vector3(0, 1, 0), headUp).normalize();
  /* A touch of extra neck: the mesh's shoulders otherwise swallow the helmet
     and he reads as headless from twenty metres. */
  const neckJ = shC.clone().addScaledVector(headDir, BONE.neck);
  const headJ = neckJ.clone().addScaledVector(headDir, BONE.head);
  const shL = shC.clone().addScaledVector(shAx, BONE.shHalf);
  const shR = shC.clone().addScaledVector(shAx, -BONE.shHalf);
  const hipL = P.clone().addScaledVector(hipAx, BONE.hipHalf);
  const hipR = P.clone().addScaledVector(hipAx, -BONE.hipHalf);
  /* The model's LEFT leg is the FRONT leg for a right-hander — his left
     shoulder and left hip are the ones leading down the pitch. This was the
     wrong way round, so the leading hip was being driven to the trailing foot
     and the legs scissored against the torso. */
  /* Pole vectors decide which way each knee points. These were -0.30 and +0.35,
     which pushed the front knee to the off and the back knee to the leg side —
     and once the feet and hips were brought into line those poles became the
     ONLY thing separating the legs, holding the knees 13cm apart and leaving a
     third of the back pad showing from the umpire's end. Both knees now point
     essentially straight down the pitch, so the back leg sits behind the front
     one where it belongs. */
  const legL = ik2(hipL, new THREE.Vector3(...S.frontFoot), BONE.thigh, BONE.shin, S.legPoleL ? new THREE.Vector3(...S.legPoleL) : new THREE.Vector3(-0.12, 0, 1));
  const legR = ik2(hipR, new THREE.Vector3(...S.backFoot),  BONE.thigh, BONE.shin, S.legPoleR ? new THREE.Vector3(...S.legPoleR) : new THREE.Vector3(0.10, 0, 1));
  const grip = new THREE.Vector3(...S.grip);
  /* Both hands go to the one grip unless a pose says otherwise — a fielder
     with a hand on each knee gives each arm its own target. */
  const gripL = S.gripL ? new THREE.Vector3(...S.gripL) : grip;
  const gripR = S.gripR ? new THREE.Vector3(...S.gripR) : grip;
  /* Top hand (left, front) elbow tucks in toward the off side; bottom hand
     (right, back) elbow sits out and slightly behind. */
  const armL = ik2(shL, gripL, BONE.upper_arm, BONE.forearm, S.armPoleL ? new THREE.Vector3(...S.armPoleL) : new THREE.Vector3(-0.45, -1, -0.15));
  const armR = ik2(shR, gripR, BONE.upper_arm, BONE.forearm, S.armPoleR ? new THREE.Vector3(...S.armPoleR) : new THREE.Vector3(0.15, -1, -0.25));
  const el = S.batEl * D2R, az = S.batAz * D2R;
  const batDir = new THREE.Vector3(Math.sin(el) * Math.sin(az), -Math.cos(el), Math.sin(el) * Math.cos(az)).normalize();
  /* The legs get their own twist reference rather than the hip axis. A batsman
     opens his hips and shoulders but his feet stay parallel to the crease and
     his knees — and therefore the face of both pads — stay pointing down the
     pitch. Twisting the legs with the hips turned the pads side-on, which from
     the umpire's end is precisely the thing you're trying to look at. */
  return { P, spine, chestJ, shC, neckJ, headJ, shL, shR, hipL, hipR, legL, legR, armL, armR, grip, gripL, gripR, batDir,
           hipRef: hipAx, shRef: shAx, headRef: lateral(S.hipYaw * 0.12),
           legRefF: lateral(8), legRefB: lateral(18) };
}

/* Where the front leg actually is at a given height, in the figure's own
   coordinates. Used to check that the pad and the ball are in the same place;
   see padOffsetFor(). */
function frontLegAt(J, y) {
  const seg = (a, b) => {
    if ((y > a.y && y > b.y) || (y < a.y && y < b.y)) return null;
    const t = Math.abs(b.y - a.y) < 1e-6 ? 0 : (y - a.y) / (b.y - a.y);
    return { x: lerp(a.x, b.x, t), z: lerp(a.z, b.z, t) };
  };
  return seg(J.legL.end, J.legL.mid) || seg(J.legL.mid, J.hipL) ||
         { x: J.legL.end.x, z: J.legL.end.z };
}

/* ---------- driving a figure's bones ---------- */
const _ax = new THREE.Vector3(), _ay = new THREE.Vector3(), _az = new THREE.Vector3();
const _mw = new THREE.Matrix4(), _inv = new THREE.Matrix4(), _loc = new THREE.Matrix4();
const UP = new THREE.Vector3(0, 1, 0);

function setBone(fig, name, head, tail, ref) {
  const bone = fig.bones[name];
  if (!bone) return;
  _ay.subVectors(tail, head);
  if (_ay.lengthSq() < 1e-8) return;
  _ay.normalize();
  _ax.copy(ref);
  if (Math.abs(_ax.dot(_ay)) > 0.985) _ax.set(0, 0, 1);
  _ax.addScaledVector(_ay, -_ax.dot(_ay)).normalize();
  _az.crossVectors(_ax, _ay);
  _mw.makeBasis(_ax, _ay, _az);
  _mw.setPosition(head.x + fig.ox, head.y, head.z + fig.oz);
  _inv.copy(bone.parent.matrixWorld).invert();
  _loc.multiplyMatrices(_inv, _mw);
  _loc.decompose(bone.position, bone.quaternion, bone.scale);
  bone.updateMatrixWorld(true);
}

function poseFigure(fig, S) {
  if (!fig || !fig.ready) return;
  const J = solveSkeleton(S);
  const p1 = J.P.clone().addScaledVector(J.spine, BONE.pelvis);
  /* Each boot gets its own direction. The back foot lies parallel to the
     crease — pointing across toward the off side — and the front foot opens
     up part way down the pitch. Both pointing at the bowler read as a man
     standing to attention. */
  const fwdF = footDir(-0.36, 0.93);
  const fwdB = footDir(-0.86, 0.51);
  const blL = J.gripL.clone().addScaledVector(J.batDir, BONE.hand);
  const blR = J.gripR.clone().addScaledVector(J.batDir, BONE.hand);
  setBone(fig, 'pelvis', J.P, p1, J.hipRef);
  setBone(fig, 'spine', p1, J.chestJ, J.hipRef);
  setBone(fig, 'chest', J.chestJ, J.shC, J.shRef);
  setBone(fig, 'neck', J.shC, J.neckJ, J.shRef);
  setBone(fig, 'head', J.neckJ, J.headJ, J.headRef);
  setBone(fig, 'shoulderL', J.shC, J.shL, UP);
  setBone(fig, 'upper_armL', J.shL, J.armL.mid, UP);
  setBone(fig, 'forearmL', J.armL.mid, J.armL.end, UP);
  setBone(fig, 'handL', J.armL.end, blL, J.shRef);
  setBone(fig, 'shoulderR', J.shC, J.shR, UP);
  setBone(fig, 'upper_armR', J.shR, J.armR.mid, UP);
  setBone(fig, 'forearmR', J.armR.mid, J.armR.end, UP);
  setBone(fig, 'handR', J.armR.end, blR, J.shRef);
  setBone(fig, 'thighL', J.hipL, J.legL.mid, J.legRefF);
  setBone(fig, 'shinL', J.legL.mid, J.legL.end, J.legRefF);
  setBone(fig, 'footL', J.legL.end, J.legL.end.clone().addScaledVector(fwdF, BONE.foot), J.legRefF);
  setBone(fig, 'thighR', J.hipR, J.legR.mid, J.legRefB);
  setBone(fig, 'shinR', J.legR.mid, J.legR.end, J.legRefB);
  setBone(fig, 'footR', J.legR.end, J.legR.end.clone().addScaledVector(fwdB, BONE.foot), J.legRefB);
  return J;
}

/* ---------- kit ---------- */
/* The helmet came out of Blender in a near-black navy, which is what real
   players wear — but it sat against a near-black sightscreen at a distance of
   twenty metres, so on a phone the head simply wasn't there. These are lifted
   until the head reads as a head. The grille does most of the work: a light
   band across the face is what the eye locks onto. */
const KIT_BAT = {
  Helmet: 0x33518c, Peak: 0x2a4272, Grille: 0xaeb8c2,
  BatBlade: 0xdcbc80, BatHandle: 0x2a2a30,
  /* Pads were within a shade of the trousers, so they read as part of the leg
     rather than as strapped-on kit. Real pads are a brighter, cooler white than
     cricket flannels — the separation is most of what makes them look like pads
     at a distance. The SHAPE is still wrong (square-cornered slabs that do not
     taper to the ankle) and that is a Blender job. */
  PadL: 0xf7f5ec, PadR: 0xf7f5ec, KneeRollL: 0xfcfbf5, KneeRollR: 0xfcfbf5
};
const KIT_FIELD = { GloveL: 0xb08d5e, GloveR: 0xb08d5e };
const HEAD_PARTS = ['Helmet', 'Peak', 'Grille'];
/* Fielders wear a cap, not a helmet. The body has a real head now, so the cap
   is the only thing added: a shallow dome and a peak parented to the head bone
   so they follow the pose for free. Sized to the skull of this body — its
   crown is about 25cm above the head bone's root. */
function capAndFace(colour, tone) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: colour });
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.108, 16, 10, 0, Math.PI * 2, 0, Math.PI * 0.56), mat);
  cap.position.set(0, 0.146, 0.010);
  cap.scale.set(1, 0.92, 1.06);
  g.add(cap);
  /* The peak: a flat slice of a wide disc, out over the eyes and tipped down a
     little, so from twenty metres it reads as a cap and not a skullcap. */
  const peak = new THREE.Mesh(new THREE.CylinderGeometry(0.118, 0.118, 0.012, 16, 1, false, -0.95, 1.9), mat);
  peak.position.set(0, 0.160, 0.046);
  peak.scale.set(1.05, 1, 1.25);
  peak.rotation.x = 0.28;
  g.add(peak);
  return g;
}
const BAT_PARTS  = ['BatBlade', 'BatHandle'];

/* The bat is modelled 0.80m from the wrist on this body — a real bat held near
   the top of the handle — and its face is turned to meet the bowler in the
   model itself, so nothing is done to it here any more. */
const PAD_PARTS  = ['PadL', 'PadR', 'KneeRollL', 'KneeRollR',
                    'StrapL0', 'StrapL1', 'StrapL2', 'StrapR0', 'StrapR1', 'StrapR2'];

function glbBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
let GLB_BYTES = null;
/* The model bytes come from one of two places: baked into the page as base64
   (the preview artifact, which cannot fetch anything), or a separate file the
   phone can cache (the live site — 1.1MB that a returning player never
   downloads twice). One shared promise, so four figures cost one fetch. */
let GLB_PROMISE = null;
function glbBuffer() {
  if (!GLB_PROMISE) {
    GLB_PROMISE = (typeof BATSMAN_GLB_URL !== 'undefined')
      ? fetch(BATSMAN_GLB_URL).then(r => { if (!r.ok) throw new Error('model ' + r.status); return r.arrayBuffer(); })
      : Promise.resolve(GLB_BYTES || (GLB_BYTES = glbBytes(BATSMAN_GLB_B64)));
  }
  return GLB_PROMISE;
}

/* A crude stand-in that appears immediately. If the real model loads it is
   removed; if it doesn't, you get a visible figure and an on-screen warning
   instead of an empty pitch and no explanation. */
function fallbackFigure(ox, oz) {
  const g = new THREE.Group();
  const kit = new THREE.MeshLambertMaterial({ color: 0xdfe3d8 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x1e2b3a });
  const add = (w, h, d, x, y, z, m) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m || kit);
    b.position.set(x, y, z); g.add(b);
  };
  add(0.34, 0.52, 0.24, 0.05, 1.10, -0.02);
  add(0.20, 0.22, 0.20, 0.05, 1.48, -0.02, dark);
  add(0.17, 0.55, 0.20, -0.06, 0.30, 0.04);
  add(0.17, 0.55, 0.20, 0.17, 0.30, -0.06);
  g.position.set(ox, 0, oz);
  return g;
}

/* opts: { ox, oz, kit, hide, pose, scale }
   The model is embedded in this page, but GLTFLoader.load() still goes through
   the network stack to read it — and a published artifact blocks that, so the
   figure silently never appeared. Decoding the bytes ourselves and calling
   parse() removes the request entirely. */
function makeFigure(opts) {
  const group = new THREE.Group();
  const fig = { group, bones: {}, ready: false, error: null,
                ox: opts.ox || 0, oz: opts.oz || 0 };
  const stand = fallbackFigure(fig.ox, fig.oz);
  group.add(stand);
  fig.fallback = stand;
  const kit = opts.kit || KIT_BAT;
  const hide = opts.hide || [];
  const onError = err => {
    fig.error = String(err);
    console.error('figure failed to load:', err);
    showModelWarning();
  };
  glbBuffer().then(buf => {
    new THREE.GLTFLoader().parse(buf, '', gltf => {
      gltf.scene.traverse(o => {
        if (o.isBone) fig.bones[o.name] = o;
        if (o.isMesh || o.isSkinnedMesh) {
          o.frustumCulled = false;    // a hand-posed skinned mesh fools the culler
          o.castShadow = false;
          if (hide.indexOf(o.name) >= 0) o.visible = false;
          const c = kit[o.name];
          if (c !== undefined && o.material) {
            o.material = o.material.clone();
            o.material.color.setHex(c);
          }
        }
      });
      if (opts.cap && fig.bones.head) fig.bones.head.add(capAndFace(opts.cap, opts.tone || 0xcf9c74));
      group.add(gltf.scene);
      group.remove(stand);
      fig.fallback = null;
      fig.ready = true;
      if (opts.scale) gltf.scene.scale.setScalar(opts.scale);
      if (opts.pose) poseFigure(fig, opts.pose);
    }, onError);
  }).catch(onError);
  return fig;
}

/* ---------- the batsman ---------- */
let batter = null;
function makeBatter() {
  batter = makeFigure({ ox: GROUP_X, oz: GROUP_Z, kit: KIT_BAT, pose: K.stance });
  // if it hasn't arrived in five seconds, say so rather than showing an empty pitch
  setTimeout(() => { if (!batter.ready) showModelWarning(); }, 5000);
  return batter;
}

let dynCache = null;
function ensureDyn(d) {
  if (!dynCache || dynCache.owner !== d) dynCache = { owner: d, poses: dynamicPoses(d) };
  return dynCache.poses;
}
function batterRunup(d, r) {
  batter.group.visible = true;
  /* No lateral travel during the run-up. He is standing still here, so any
     correction to his position reads as the whole man sliding sideways across
     the crease — which is exactly what it was. All of it now happens while the
     ball is in the air and his feet are moving, where it reads as footwork. */
  applyGuard(d, 0);
  poseFigure(batter, walk(SEG_RUN, K, clamp(r, 0, 1)));
}
function batterPose(d, p) {
  const dyn = ensureDyn(d);
  batter.group.visible = true;
  applyGuard(d, smooth(clamp((p - 0.34) / 0.66, 0, 1)));
  const bank = d.shot ? Object.assign({}, K, dyn) : K;
  poseFigure(batter, walk(d.shot ? SEG_SHOT : SEG_LEAVE, bank, clamp(p, 0, 1.95)));
}
function stance() {
  batter.group.visible = true;
  poseFigure(batter, K.stance);
}

/* The pad has to be where the ball is, or the "impact" is a ball passing
   through thin air next to a leg. The pose is aimed at the impact point, but
   the stride clamps and the IK can leave it several centimetres out. Rather
   than bend the ball, we shift the whole batsman sideways by the shortfall —
   a few centimetres, invisible, and it guarantees the two meet. */
function contactPose(d) {
  const dyn = dynamicPoses(d);
  return d.shot ? dyn.contact : K.raised;
}
function padOffsetFor(d) {
  const J = solveSkeleton(contactPose(d));
  const leg = frontLegAt(J, clamp(d.iy, 0.06, 0.95));
  return {
    x: clamp((d.ix - GROUP_X) - leg.x, -0.38, 0.38),
    z: clamp((d.iz - GROUP_Z) - leg.z, -0.15, 0.15)
  };
}
/* What the body shift CANNOT cover. The batsman is moved sideways up to 30cm to
   put his pad where the ball is; anything beyond that used to be fixed by
   bending the ball in flight, which moved the bounce along with it and left the
   pitch marker sitting off the path. This reports the shortfall so the delivery
   generator can fix it at source — by bowling a marginally different ball —
   instead of the renderer faking it afterwards. */
function padResidual(d) {
  const J = solveSkeleton(contactPose(d));
  const leg = frontLegAt(J, clamp(d.iy, 0.06, 0.95));
  const raw = (d.ix - GROUP_X) - leg.x;
  return raw - clamp(raw, -0.38, 0.38);
}
function padContactPoint(d) {
  const J = solveSkeleton(contactPose(d));
  const leg = frontLegAt(J, clamp(d.iy, 0.06, 0.95));
  return { x: leg.x + batter.ox, z: leg.z + batter.oz };
}
/* Lining his pad up with the ball is what makes the impact read — but doing all
   of it before the ball is bowled meant he sometimes TOOK GUARD thirty
   centimetres off, which you can see: he looks like he is guarding off stump.
   So he now starts on a normal guard (six centimetres of slop at most) and
   travels the rest across the run-up and the delivery. Moving your feet while
   the ball is on its way is what batsmen do, so the correction hides inside the
   footwork instead of showing up as a strange starting position. */
function placeBatter(d) {
  dynCache = null;
  const o = padOffsetFor(d);
  d._guard = { x: clamp(o.x, -0.045, 0.045), z: clamp(o.z, -0.04, 0.04) };
  d._drift = { x: o.x - d._guard.x, z: o.z - d._guard.z };
  batter.padOffset = o;
  applyGuard(d, 0);
  batterRunup(d, 0);
}
function applyGuard(d, f) {
  if (!d._guard) return;
  batter.ox = GROUP_X + d._guard.x + d._drift.x * f;
  batter.oz = GROUP_Z + d._guard.z + d._drift.z * f;
}

/* ---------- keeper and slips ---------- */
/* All three are the same model parsed again: no bat, and the slips lose their
   pads. They stand square on to the bowler, which is what you see from the
   umpire's end. A quick bowler pushes the keeper 14 metres back and brings the
   slips with him; against spin he comes up to the stumps and one slip stays. */
let keeper = null, slips = [], fielders = [];
/* Three men built from one model will read as three copies of the same man
   unless you make them different, and the eye picks that up long before it
   picks up a lumpy shoulder. Each gets his own height, his own skin tone, his
   own depth of crouch and his own idle rhythm. None of it is expensive and it
   is the single biggest thing that stops them looking like cardboard. */
const TONES = [0xd6a980, 0xb27f55, 0x8a5a3a, 0xe0b892];
function variant(i, deep) {
  return {
    scale: [1.045, 0.955, 1.005][i % 3],
    tone: TONES[i % TONES.length],
    cap: [0x6d2230, 0x60202c, 0x76262f][i % 3],
    jit: { tilt: [-2.5, 3.5, 0.5][i % 3], pelvis: [0.022, -0.026, 0.004][i % 3] + (deep || 0),
           spread: [0.018, -0.014, 0.004][i % 3], hands: [-0.018, 0.020, 0.002][i % 3] },
    idle: { phase: i * 2.1, rate: 0.85 + i * 0.19, amp: 0.016 + i * 0.004 }
  };
}
function makeField() {
  const mk = (i, ox, oz, base, hide) => {
    const v = variant(i);
    const f = makeFigure({ ox, oz, kit: KIT_FIELD, cap: v.cap, tone: v.tone,
                           scale: v.scale, hide, pose: handsOnKnees(base) });
    f.v = v; f.base = base;
    return f;
  };
  keeper = mk(0, -0.26, -15.2, FIELD.keeperBack, BAT_PARTS.concat(HEAD_PARTS));
  slips = [
    mk(1, -1.85, -14.6, FIELD.slip, BAT_PARTS.concat(PAD_PARTS).concat(HEAD_PARTS)),
    mk(2, -3.30, -14.0, FIELD.slip, BAT_PARTS.concat(PAD_PARTS).concat(HEAD_PARTS))
  ];
  fielders = [keeper].concat(slips);
  return fielders;
}

/* A crouching fielder is never still. This bobs each of them on his own clock,
   rocks his weight a little and drifts his hands, so the slip cordon looks like
   men waiting rather than three statues someone put down. */
function poseField(fig, t) {
  if (!fig || !fig.ready || !fig.base) return;
  const v = fig.v, b = fig.base;
  const w = Math.sin(t * v.idle.rate + v.idle.phase);
  const w2 = Math.sin(t * v.idle.rate * 0.63 + v.idle.phase * 1.7);
  const drift = g => [g[0] + w2 * 0.012, g[1] + v.jit.hands + w * v.idle.amp * 0.8, g[2] - w * 0.014];
  const S = Object.assign({}, b, {
    pelvis: [b.pelvis[0] + w2 * 0.012, b.pelvis[1] + v.jit.pelvis + w * v.idle.amp, b.pelvis[2]],
    hipYaw: b.hipYaw + w2 * 2.5, shYaw: b.shYaw + w * 1.5,
    tilt: b.tilt + v.jit.tilt - w * 2.2, side: b.side + w2 * 1.6,
    backFoot: [b.backFoot[0] - v.jit.spread, b.backFoot[1], b.backFoot[2]],
    frontFoot: [b.frontFoot[0] + v.jit.spread, b.frontFoot[1], b.frontFoot[2]],
    grip: drift(b.grip)
  });
  if (b.gripL) { S.gripL = drift(b.gripL); S.gripR = drift(b.gripR); }
  poseFigure(fig, handsOnKnees(S));
}
function fieldIdle(t) { for (const f of fielders) if (f.group.visible) poseField(f, t); }
/* Where they stand depends on the bowler, and it is a genuine cue: a keeper
   standing up to the stumps tells you it is spin before the ball is bowled. */
function setFieldFor(type) {
  const spin = type === 'spin';
  const kz = spin ? -1.55 : -15.2, kx = spin ? -0.18 : -0.26;
  if (keeper && keeper.ready) {
    keeper.ox = kx; keeper.oz = kz;
    poseFigure(keeper, handsOnKnees(spin ? FIELD.keeperUp : FIELD.keeperBack));
  }
  /* To a spinner the slip stands a few yards behind the keeper and wider, not
     at his elbow — which is where he was, and it looked wrong. */
  const spots = spin ? [[-1.30, -3.9], [-2.1, -3.6]]
                     : [[-2.05, -14.5], [-3.75, -13.8]];
  slips.forEach((s, i) => {
    if (!s.ready) return;
    s.group.visible = spin ? i === 0 : true;     // one slip to the spinner
    s.ox = spots[i][0]; s.oz = spots[i][1];
    poseFigure(s, handsOnKnees(FIELD.slip));
  });
}

function showModelWarning() {
  const el = document.querySelector('.note');
  if (el) {
    el.textContent = 'Model failed to load — showing a stand-in.';
    el.style.color = '#ffd23f';
  }
}
</script>
<script>/* ============================================================
   SIGN-IN AND THE DAILY LEADERBOARD

   The game is a static page, so this talks straight to Supabase
   from the browser: Google sign-in through Supabase Auth, and one
   small table of scores protected by row-level security (a player
   can only ever write a row as themselves, and only one per day).

   Everything in here is optional. With no OO_CONFIG on the page —
   the preview artifact, a local copy — the game plays exactly as
   before and the leaderboard buttons explain themselves. Only the
   DAY'S over counts: practice overs ("Bowl another over") and
   ?seed= overrides are played for fun and never posted.
   ============================================================ */

const LB = {
  cfg: (typeof window !== 'undefined' && window.OO_CONFIG) || null,
  client: null, user: null, name: null,
  ready: false, pendingShown: false
};
/* game.js loads after this file, so anything that needs its constants is a
   function rather than a top-level value. */
const isDaily = () => !params.get('seed');
const lbDay = () => SEED_KEY;
let practice = false;                       // flipped by "Bowl another over"

function lbEnabled() { return !!(LB.cfg && LB.cfg.supabaseUrl && LB.cfg.supabaseAnonKey && window.supabase); }

/* ---------- local memory of today's over ----------
   The first over of the day is the one that counts, so it is remembered on
   the device the moment it ends. That also carries the score across the
   Google sign-in round trip: the page reloads after sign-in, sees the day's
   result waiting, and posts it. */
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } };
const resultKey = () => 'oo3d:result:' + lbDay();

function rememberResult(right, grid, bowler) {
  if (!isDaily() || practice) return null;
  const have = lsGet(resultKey());
  if (have) return have;                    // the first over of the day stands
  const r = { day: lbDay(), score: right, grid, bowler, at: Date.now(), posted: false };
  lsSet(resultKey(), r);
  return r;
}

/* ---------- play counter ----------
   Two anonymous events, so Pat can see how many people actually play: one
   when the page opens (once per browser session), one when an over ends,
   with the score. No name, no account, no cookie — just a row with a date. */
function lbTrack(event, extra) {
  if (!LB.client) return;
  try {
    LB.client.from('plays').insert(Object.assign({ day: todayKey(), event }, extra || {}))
      .then(() => {}, () => {});
  } catch (e) { /* counting is never allowed to break the game */ }
}

/* ---------- auth ---------- */
async function lbInit() {
  if (!lbEnabled()) { lbPaintAuth(); return; }
  try {
    LB.client = window.supabase.createClient(LB.cfg.supabaseUrl, LB.cfg.supabaseAnonKey);
    let seen = false;
    try { seen = !!sessionStorage.getItem('oo3d:visit'); sessionStorage.setItem('oo3d:visit', '1'); } catch (e) { /* private mode */ }
    if (!seen) lbTrack('visit');
    const { data } = await LB.client.auth.getSession();
    await lbSetUser(data && data.session ? data.session.user : null);
    LB.client.auth.onAuthStateChange((_e, session) => { lbSetUser(session ? session.user : null); });
    LB.ready = true;
  } catch (e) {
    console.warn('leaderboard unavailable:', e);
  }
  lbPaintAuth();
}

async function lbSetUser(user) {
  LB.user = user || null;
  LB.name = null;
  if (user) {
    const m = user.user_metadata || {};
    const fallback = (m.full_name || m.name || (user.email || 'Umpire').split('@')[0]).trim().slice(0, 24);
    try {
      const { data } = await LB.client.from('profiles').select('name').eq('id', user.id).maybeSingle();
      if (data && data.name) LB.name = data.name;
      else {
        /* The database refuses names that fail the word filter. A Google name
           that trips it gets a neutral one instead of no profile at all. */
        let { error } = await LB.client.from('profiles').upsert({ id: user.id, name: fallback });
        LB.name = fallback;
        if (error) {
          const alt = 'Umpire ' + String(Math.floor(1000 + Math.random() * 9000));
          ({ error } = await LB.client.from('profiles').upsert({ id: user.id, name: alt }));
          if (!error) LB.name = alt;
        }
      }
    } catch (e) { LB.name = fallback; }
    // a result that ended before sign-in, or before the page reloaded
    const r = lsGet(resultKey());
    if (r && !r.posted) {
      await lbPost(r);
      if (typeof phase !== 'undefined' && phase === 'over') lbOnOverEnd(r.score, r.grid, r.bowler);
      if (!LB.pendingShown) { LB.pendingShown = true; lbOpen('today'); }
    }
  }
  lbPaintAuth();
}

function lbSignIn() {
  if (!lbEnabled() || !LB.client) return;
  LB.client.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname }
  });
}
async function lbSignOut() {
  if (LB.client) await LB.client.auth.signOut();
  await lbSetUser(null);
}
async function lbRename(name) {
  name = (name || '').trim().slice(0, 24);
  if (!name || !LB.user) return;
  const { error } = await LB.client.from('profiles').update({ name }).eq('id', LB.user.id);
  if (error) {
    const el = E('bSession');
    const note = document.createElement('div');
    note.className = 'bNote'; note.textContent = "That name isn't allowed on the board. Try another.";
    el.appendChild(note);
    return;
  }
  LB.name = name;
  lbPaintAuth();
}

/* ---------- posting ---------- */
async function lbPost(r) {
  if (!LB.user || !LB.client) return false;
  try {
    /* Insert, and swallow the duplicate: the table has one row per player per
       day, so a second attempt from another device simply does not count. */
    const { error } = await LB.client.from('scores').insert({
      user_id: LB.user.id, day: r.day, score: r.score, grid: r.grid, bowler: r.bowler || null
    });
    if (error && error.code !== '23505') throw error;
    r.posted = true; lsSet(resultKey(), r);
    return true;
  } catch (e) { console.warn('score not posted:', e); return false; }
}

/* ---------- reading ---------- */
async function lbFetch(mode) {
  if (!LB.client) return [];
  if (mode === 'today') {
    const { data } = await LB.client.from('scores')
      .select('score,grid,created_at,user_id,profiles(name)')
      .eq('day', lbDay()).order('score', { ascending: false }).order('created_at', { ascending: true }).limit(200);
    return (data || []).map(r => ({ id: r.user_id, name: (r.profiles && r.profiles.name) || 'Umpire', score: r.score, grid: r.grid, overs: 1 }));
  }
  /* Last 30 days: the database adds it up (the monthly_board view), so the
     page never has to pull every score row — at a few hundred players a day
     that was going to stop fitting. */
  const { data } = await LB.client.from('monthly_board')
    .select('user_id,name,total,overs').order('total', { ascending: false }).order('overs', { ascending: true }).limit(200);
  return (data || []).map(r => ({ id: r.user_id, name: r.name || 'Umpire', score: r.total, overs: r.overs }));
}

/* ---------- the panel ---------- */
let lbMode = 'today';
function lbOpen(mode) {
  lbMode = mode || lbMode;
  E('board').style.display = 'block';
  lbPaintBoard();
}
function lbClose() { E('board').style.display = 'none'; }

async function lbPaintBoard() {
  E('bTabToday').className = 'tab' + (lbMode === 'today' ? ' on' : '');
  E('bTabMonth').className = 'tab' + (lbMode === 'month' ? ' on' : '');
  E('bTitle').textContent = lbMode === 'today' ? "TODAY'S OVER" : 'LAST 30 DAYS';
  const list = E('bList'), me = E('bMe');
  me.textContent = '';
  if (!lbEnabled()) {
    list.innerHTML = '<div class="bNote">The leaderboard lives on the real site — this preview copy keeps scores to itself.</div>';
    return;
  }
  list.innerHTML = '<div class="bNote">Loading…</div>';
  const rows = await lbFetch(lbMode);
  if (!rows.length) { list.innerHTML = '<div class="bNote">Nobody has posted yet. Be first.</div>'; return; }
  const myIdx = LB.user ? rows.findIndex(r => r.id === LB.user.id) : -1;
  list.innerHTML = rows.slice(0, 25).map((r, i) => {
    const mine = LB.user && r.id === LB.user.id;
    const right = lbMode === 'today'
      ? '<span class="bGrid">' + (r.grid || '') + '</span><b>' + r.score + '/6</b>'
      : '<span class="bGrid">' + r.overs + (r.overs === 1 ? ' over' : ' overs') + '</span><b>' + r.score + '</b>';
    return '<div class="bRow' + (mine ? ' me' : '') + '"><i>' + (i + 1) + '</i><span class="bName">' + esc(r.name) + '</span>' + right + '</div>';
  }).join('');
  if (LB.user) {
    me.textContent = myIdx < 0
      ? (lbMode === 'today' ? "You haven't posted today's over yet." : 'No overs from you in the last 30 days.')
      : 'You are ' + ordinal(myIdx + 1) + ' of ' + rows.length + '.';
  }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][Math.min(n % 10, 4)] || 'th');

/* The little sign-in line under the title, and the state of the buttons. */
function lbPaintAuth() {
  const who = E('who');
  if (!lbEnabled()) { who.textContent = ''; who.onclick = null; }
  else if (LB.user) { who.textContent = '● ' + (LB.name || 'signed in'); who.onclick = () => lbOpen(); }
  else { who.textContent = 'SIGN IN'; who.onclick = lbSignIn; }
  const s = E('bSession');
  if (!lbEnabled()) s.innerHTML = '';
  else if (LB.user) s.innerHTML = 'Playing as <b id="bName">' + esc(LB.name || '') + '</b> · <a id="bRename">change name</a> · <a id="bOut">sign out</a>';
  else s.innerHTML = '<button class="wide" id="bIn">Sign in with Google</button><div class="bNote">One tap. Your name goes on the board, nothing else.</div>';
  if (E('bIn')) E('bIn').onclick = lbSignIn;
  if (E('bOut')) E('bOut').onclick = lbSignOut;
  if (E('bRename')) E('bRename').onclick = () => {
    s.innerHTML = '<input id="bNameIn" maxlength="24" placeholder="Your name on the board"> <button class="ghost" id="bSave" style="width:auto;padding:8px 12px">Save</button>';
    E('bNameIn').value = LB.name || '';
    E('bSave').onclick = () => lbRename(E('bNameIn').value);
  };
}

/* Called from the end-of-over screen. Decides what the summary says about
   posting, and posts if it can. */
async function lbOnOverEnd(right, grid, bowler) {
  lbTrack('over', { score: right, practice: !isDaily() || practice, signed_in: !!LB.user });
  const post = E('post');
  if (!isDaily() || practice) { post.textContent = 'Practice over — not posted.'; return; }
  const r = rememberResult(right, grid, bowler);
  if (!r) { post.textContent = ''; return; }
  if (!lbEnabled()) { post.textContent = ''; return; }
  if (r.posted) { post.innerHTML = "Today's over already posted · <a id=\"pView\">see the board</a>"; E('pView').onclick = () => lbOpen('today'); return; }
  if (LB.user) {
    post.textContent = 'Posting…';
    const ok = await lbPost(r);
    post.innerHTML = ok ? 'Posted · <a id="pView">see where you stand</a>' : 'Could not post — <a id="pRetry">try again</a>';
    if (E('pView')) E('pView').onclick = () => lbOpen('today');
    if (E('pRetry')) E('pRetry').onclick = () => lbOnOverEnd(right, grid, bowler);
  } else {
    post.innerHTML = '<button class="wide gold" id="pIn">Sign in to post ' + right + '/6</button>';
    E('pIn').onclick = lbSignIn;
  }
}
</script>
<script>/* ============================================================
   OVER & OUT — 3D
   Everything is in real-world metres. The ball is not run through
   a physics engine: every delivery is described by a handful of
   numbers and the flight is solved from them, so the same seed
   gives every player the identical over.
   ============================================================ */

/* ---------- the actual laws-of-cricket measurements ---------- */
const PITCH_LEN   = 20.12;   // stumps to stumps (22 yards)
const PITCH_W     = 3.05;    // width of the prepared strip
const STUMP_H     = 0.711;   // 28 inches
const STUMP_R     = 0.0175;  // stump radius
const STUMP_X     = 0.0968;  // centre of each outer stump
const HALF_W      = 0.1143;  // half the width of the whole wicket
const CREASE      = 1.22;    // popping crease, 4ft in front of the stumps
const RETURN_X    = 1.32;    // return crease either side
const BALL_R      = 0.036;
const G           = 9.81;
const REL_Z       = 17.6;    // where the ball leaves the hand
const REL_Y       = 2.15;
const UMP_Z       = PITCH_LEN + 1.45;
/* Camera height. A standing umpire's eye is 1.78m — and at that height the
   batsman's head sits ABOVE the boundary, so his background is the sightscreen
   and the stand rather than grass. Every broadcast frame of an LBW, including
   both of the references this was built against, comes from a raised camera
   behind the arm: the geometry says you need to be above about 2.4m before the
   outfield rises behind the batsman's head, and 3.2m puts it comfortably there.
   The honest trade: height makes the "is it going over?" judgement slightly
   easier and the line judgement slightly harder. It is one number to argue
   about, like the field of view. */
const UMP_Y       = 3.15;
const BALLS_PER_OVER = 6;

/* Field of view is a deliberate cheat. A truly realistic 24mm-equivalent
   view makes the stumps ~14 screen pixels wide at 20m and the game becomes
   guesswork. 16 degrees is roughly what a broadcast camera behind the arm does,
   and what your attention does. Tunable — this is the number to argue about. */
const FOV = 16;

/* off side is negative X, leg side is positive X — same convention as the 2D game */

/* ---------- seeded randomness ----------
   Every player gets the same over on the same day. Nothing in the delivery
   generator may call Math.random, or the share grid stops meaning anything. */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayKey() {
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
const params = new URLSearchParams(location.search);
const SEED_KEY = params.get('seed') || todayKey();
let rng = mulberry32(hashStr('over-and-out:' + SEED_KEY));

const rnd = (a, b) => a + rng() * (b - a);
const pick = a => a[Math.floor(rng() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
/* Gaussian-ish: bowlers aim at off stump and just outside it. A flat random
   line across the strip put 37% of deliveries outside leg, which is nonsense. */
function gauss() { return (rng() + rng() + rng() + rng() - 2) / 0.816; }

/* ---------- scene ---------- */
let scene, camera, renderer, ball, stumpsNear, stumpsFar, trackLine, predLine, marks = [];
let W = 0, H = 0;

/* --- textures, drawn in a canvas so nothing is fetched from anywhere --- */
function canvasTex(w, h, draw, repX, repY) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (repX || repY) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repX || 1, repY || 1);
  }
  t.anisotropy = 4;
  return t;
}

/* The strip. A Test pitch on day one is not a flat brown rectangle: it has a
   worn line where the bowlers land, rough outside off from the follow-through,
   and cracks that open through the match. All of it is drawn from the seed, so
   the pitch is the same for everyone playing the same over. */
/* Cracks, as data. The texture draws them and the delivery generator checks
   whether the ball landed on one, so a ball that misbehaves has visibly landed
   on the thing that made it misbehave. Seeded like everything else. */
function makeCracks() {
  const prng = mulberry32(hashStr('cracks:' + SEED_KEY));
  const r = (lo, hi) => lo + prng() * (hi - lo);
  const cracks = [];
  const n = 9 + (prng() * 4 | 0);
  for (let i = 0; i < n; i++) {
    /* The first few live in the corridor on a length — where the ball actually
       goes — so a crack matters about one ball in ten rather than never. The
       rest are scattered for the look of a worn pitch. */
    const corridor = i < 4;
    let x = corridor ? r(-0.40, 0.18) : r(-1.15, 1.15);
    let z = corridor ? r(4.2, 8.8) : r(1.4, 18.0);
    const along = prng() < 0.78;                        // most run down the pitch
    const dirZ = prng() < 0.5 ? -1 : 1;
    const pts = [[x, z]];
    const steps = 6 + (prng() * 6 | 0);
    for (let k = 0; k < steps; k++) {
      if (along) { x += r(-0.06, 0.06); z += dirZ * r(0.10, 0.30); }
      else       { x += (dirZ) * r(0.08, 0.22); z += r(-0.08, 0.08); }
      pts.push([x, z]);
    }
    cracks.push({ pts, w: r(0.006, 0.015) });
  }
  return cracks;
}
const CRACKS = makeCracks();
/* Is a landing point on a crack? Within a ball's radius of the centre line. */
function nearCrack(px, pz) {
  for (const c of CRACKS) {
    for (let i = 1; i < c.pts.length; i++) {
      const [ax, az] = c.pts[i - 1], [bx, bz] = c.pts[i];
      const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1e-9;
      const t = clamp(((px - ax) * dx + (pz - az) * dz) / L2, 0, 1);
      const qx = ax + dx * t, qz = az + dz * t;
      if (Math.hypot(px - qx, pz - qz) < BALL_R + c.w * 0.5) return true;
    }
  }
  return false;
}

/* The strip. A pitch on day four is not a flat brown rectangle: it has a worn
   band where the bowlers land, footmark rough outside off from the
   follow-throughs, ball marks on a length, and cracks that have opened. All of
   it is drawn from the seed, so the pitch is the same for everyone playing the
   same over — and the rough and the cracks are drawn from the SAME data the
   ball reacts to. */
function pitchTexture() {
  const prng = mulberry32(hashStr('pitch:' + SEED_KEY));
  return canvasTex(448, 1792, (g, w, h) => {
    const ux = x => ((x + PITCH_W / 2) / PITCH_W) * w;
    const vy = z => (1 - (22.12 - z) / (PITCH_LEN + 4)) * h;
    const PX = w / PITCH_W;                              // pixels per metre
    g.fillStyle = '#bda27b'; g.fillRect(0, 0, w, h);
    // broad tonal blotching
    for (let i = 0; i < 360; i++) {
      const r = 18 + prng() * 110;
      g.fillStyle = 'rgba(' + (170 + prng() * 45 | 0) + ',' + (145 + prng() * 40 | 0) + ',' + (100 + prng() * 35 | 0) + ',0.16)';
      g.beginPath(); g.arc(prng() * w, prng() * h, r, 0, 7); g.fill();
    }
    // the worn band down the middle where the ball lands — a soft ellipse, so it
    // fades out toward both ends instead of stopping at a line
    g.save(); g.translate(w / 2, h / 2); g.scale(1, (h * 0.34) / (w * 0.5));
    const band = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.5);
    band.addColorStop(0, 'rgba(150,124,86,0.36)'); band.addColorStop(0.55, 'rgba(150,124,86,0.28)');
    band.addColorStop(1, 'rgba(150,124,86,0)');
    g.fillStyle = band; g.fillRect(-w, -w, 2 * w, 2 * w); g.restore();
    // ball marks: small dark ovals clustered on a good length at both ends
    for (const [z0, z1] of [[4.5, 9.5], [PITCH_LEN - 9.5, PITCH_LEN - 4.5]]) {
      for (let i = 0; i < 170; i++) {
        const x = ux(-0.55 + gaussP(prng) * 0.30), y = vy(z0 + prng() * (z1 - z0));
        g.fillStyle = 'rgba(118,94,60,' + (0.10 + prng() * 0.25).toFixed(2) + ')';
        g.beginPath(); g.ellipse(x, y, 1.2 + prng() * 2.2, 2 + prng() * 3.5, 0, 0, 7); g.fill();
      }
    }
    /* The rough: dozens of overlapping footmarks — each a dark hollow with a
       pale, torn rim on the lit side — plus loose flecks. Drawn from the same
       rectangle the ball reacts to, at both ends. */
    const rough = (x0, x1, z0, z1) => {
      const cx = ux((x0 + x1) / 2), cy = vy((z0 + z1) / 2);
      const rx = (x1 - x0) * PX * 0.70, ry = (z1 - z0) * PX * 0.60;
      g.save(); g.translate(cx, cy); g.scale(rx / ry, 1);
      const rad = g.createRadialGradient(0, 0, 0, 0, 0, ry);
      rad.addColorStop(0, 'rgba(112,88,56,0.34)'); rad.addColorStop(0.6, 'rgba(112,88,56,0.20)'); rad.addColorStop(1, 'rgba(112,88,56,0)');
      g.fillStyle = rad; g.fillRect(-ry * 2, -ry * 2, ry * 4, ry * 4); g.restore();
      for (let i = 0; i < 70; i++) {
        const x = ux(x0 + 0.04 + gaussP(prng) * 0.12 + (x1 - x0) * 0.5 - 0.04);
        const y = vy(z0 + 0.2 + prng() * (z1 - z0 - 0.4));
        const rr = 3 + prng() * 5, ry2 = 5 + prng() * 7, rot = (prng() - 0.5) * 0.8;
        g.fillStyle = 'rgba(96,74,46,' + (0.14 + prng() * 0.22).toFixed(2) + ')';
        g.beginPath(); g.ellipse(x, y, rr, ry2, rot, 0, 7); g.fill();
        if (prng() < 0.5) {
          g.strokeStyle = 'rgba(222,204,168,' + (0.10 + prng() * 0.16).toFixed(2) + ')';
          g.lineWidth = 1;
          g.beginPath(); g.ellipse(x - 1, y - 1.5, rr, ry2, rot, Math.PI * 1.05, Math.PI * 1.75); g.stroke();
        }
      }
      for (let i = 0; i < 220; i++) {
        const x = ux(x0 - 0.05 + prng() * (x1 - x0 + 0.10));
        const y = vy(z0 - 0.2 + prng() * (z1 - z0 + 0.4));
        g.fillStyle = prng() < 0.65 ? 'rgba(90,68,42,' + (0.12 + prng() * 0.28).toFixed(2) + ')'
                                    : 'rgba(228,212,178,' + (0.10 + prng() * 0.22).toFixed(2) + ')';
        g.beginPath(); g.arc(x, y, 0.7 + prng() * 1.8, 0, 7); g.fill();
      }
    };
    rough(ROUGH.x0, ROUGH.x1, ROUGH.z0, ROUGH.z1);
    rough(-ROUGH.x1, -ROUGH.x0, PITCH_LEN - ROUGH.z1, PITCH_LEN - ROUGH.z0);
    /* Cracks: a dark fissure with a pale raised lip along one side, and the
       odd hairline branch. Drawn from CRACKS, which is what the ball checks. */
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const c of CRACKS) {
      const path = () => { g.beginPath(); c.pts.forEach(([x, z], i) => i ? g.lineTo(ux(x), vy(z)) : g.moveTo(ux(x), vy(z))); };
      const wpx = c.w * PX;
      g.strokeStyle = 'rgba(226,208,172,0.38)'; g.lineWidth = wpx + 1.6;
      g.save(); g.translate(-1.0, -1.0); path(); g.stroke(); g.restore();
      g.strokeStyle = 'rgba(74,54,32,0.82)'; g.lineWidth = wpx + 0.6;
      path(); g.stroke();
      if (wpx > 1.4) { g.strokeStyle = 'rgba(38,26,12,0.75)'; g.lineWidth = wpx * 0.45; path(); g.stroke(); }
      // hairline branches
      for (let k = 1; k < c.pts.length; k++) {
        if (prng() < 0.55) continue;
        const [x, z] = c.pts[k];
        g.strokeStyle = 'rgba(74,54,32,0.6)'; g.lineWidth = 0.8;
        g.beginPath(); g.moveTo(ux(x), vy(z));
        g.lineTo(ux(x) + (prng() - 0.5) * 22, vy(z) + (prng() - 0.5) * 26);
        g.stroke();
      }
    }
    // hairline cracks that do nothing — texture only
    for (let i = 0; i < 26; i++) {
      let x = w * (0.10 + prng() * 0.80), y = h * (0.10 + prng() * 0.80);
      g.strokeStyle = 'rgba(96,74,48,' + (0.20 + prng() * 0.30).toFixed(2) + ')';
      g.lineWidth = 0.6 + prng() * 0.8;
      g.beginPath(); g.moveTo(x, y);
      const steps = 3 + (prng() * 5 | 0);
      for (let s2 = 0; s2 < steps; s2++) { x += (prng() - 0.5) * 14; y += (prng() < 0.5 ? -1 : 1) * (14 + prng() * 30); g.lineTo(x, y); }
      g.stroke();
    }
  });
}
function gaussP(prng) { return (prng() + prng() + prng() + prng() - 2) / 0.816; }

/* Mown stripes. Nothing says "cricket ground" faster and it costs one texture. */
function outfieldTexture(light, dark, reps) {
  return canvasTex(16, 64, (g, w, h) => {
    g.fillStyle = dark; g.fillRect(0, 0, w, h);
    g.fillStyle = light; g.fillRect(0, 0, w, h / 2);
  }, 1, reps);
}
function crowdTexture() {
  const prng = mulberry32(0x9e3779b9);
  return canvasTex(512, 128, (g, w, h) => {
    g.fillStyle = '#17222c'; g.fillRect(0, 0, w, h);
    const cols = ['#c9d3da', '#7d8b96', '#b9484a', '#3d5f86', '#d8c48a', '#4a4f57', '#8fa2ae'];
    for (let i = 0; i < 5200; i++) {
      g.fillStyle = cols[prng() * cols.length | 0];
      g.globalAlpha = 0.35 + prng() * 0.5;
      g.fillRect(prng() * w, prng() * h, 2 + prng() * 3, 2 + prng() * 4);
    }
    g.globalAlpha = 1;
    // a few dark horizontal gangways so it isn't uniform noise
    g.fillStyle = 'rgba(6,10,14,0.55)';
    for (let i = 1; i < 4; i++) g.fillRect(0, h * i / 4, w, 3);
  }, 6, 1);
}
function boardTexture() {
  const prng = mulberry32(0x1234567);
  return canvasTex(1024, 64, (g, w, h) => {
    const cols = ['#12303f', '#8f1d26', '#1d4b34', '#2b2f6b', '#7a5a12'];
    let x = 0;
    while (x < w) {
      const bw = 90 + prng() * 130;
      g.fillStyle = cols[prng() * cols.length | 0];
      g.fillRect(x, 0, bw, h);
      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.fillRect(x + 12, h * 0.36, bw - 24, h * 0.2);
      x += bw + 3;
    }
  }, 8, 1);
}

function makeScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1620);
  scene.fog = new THREE.Fog(0x14252a, 48, 135);

  camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 400);
  resetCamera();

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

  scene.add(new THREE.HemisphereLight(0xbfd8e8, 0x2c4a22, 0.82));
  const sun = new THREE.DirectionalLight(0xffffff, 0.72);
  sun.position.set(-14, 22, 9);
  scene.add(sun);
  /* A rim from behind the batsman, so his helmet and shoulders carry a bright
     edge instead of merging into the sightscreen. */
  const rim = new THREE.DirectionalLight(0xcfe4f2, 0.28);
  rim.position.set(6, 9, -14);
  scene.add(rim);

  // outfield, mown in stripes
  const out = new THREE.Mesh(
    new THREE.CircleGeometry(70, 64),
    new THREE.MeshLambertMaterial({ color: 0xffffff, map: outfieldTexture('#39762f', '#33702b', 14) })
  );
  out.rotation.x = -Math.PI / 2;
  out.position.set(0, -0.01, PITCH_LEN / 2);
  scene.add(out);

  // the square, mown the other way so it reads as a separate block
  const sq = new THREE.Mesh(
    new THREE.PlaneGeometry(26, 32),
    new THREE.MeshLambertMaterial({ color: 0xffffff, map: outfieldTexture('#3f8034', '#3a7930', 9) })
  );
  sq.rotation.x = -Math.PI / 2;
  sq.position.set(0, 0.004, PITCH_LEN / 2);
  scene.add(sq);

  // the strip
  const strip = new THREE.Mesh(
    new THREE.PlaneGeometry(PITCH_W, PITCH_LEN + 4),
    new THREE.MeshLambertMaterial({ color: 0xffffff, map: pitchTexture() })
  );
  strip.rotation.x = -Math.PI / 2;
  strip.position.set(0, 0.010, PITCH_LEN / 2);
  scene.add(strip);

  buildGround();

  creases(0, 1);
  creases(PITCH_LEN, -1);
  stumpsNear = wicket(0);
  stumpsFar = wicket(PITCH_LEN);

  batter = makeBatter();
  scene.add(batter.group);
  for (const f of makeField()) scene.add(f.group);

  ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 20, 14),
    new THREE.MeshLambertMaterial({ color: 0xd8402f })
  );
  ball.visible = false;
  scene.add(ball);

  // a soft shadow blob under the ball — this is what sells height
  ballShadow = new THREE.Mesh(
    new THREE.CircleGeometry(BALL_R * 1.6, 16),
    new THREE.MeshBasicMaterial({ color: 0x1d2a14, transparent: true, opacity: 0.35 })
  );
  ballShadow.rotation.x = -Math.PI / 2;
  ballShadow.visible = false;
  scene.add(ballShadow);

  // a short trail — at 90mph the ball moves ~60cm between frames, and without
  // this it strobes rather than flies
  trail = new THREE.Line(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color: 0xffa294, transparent: true, opacity: 0.5 })
  );
  trail.frustumCulled = false;
  trail.visible = false;
  scene.add(trail);

  /* Contact shadows. Nothing in the scene cast one, and a figure with no shadow
     reads as pasted onto the grass rather than standing on it. A real shadow
     map for five skinned meshes is not worth the frame time on a phone; a soft
     blob under each man does almost all of the work for almost nothing. */
  const blobTex = canvasTex(64, 64, (c, w, h) => {
    const r = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(12,26,14,0.55)');
    r.addColorStop(0.55, 'rgba(12,26,14,0.28)');
    r.addColorStop(1, 'rgba(12,26,14,0)');
    c.fillStyle = r; c.fillRect(0, 0, w, h);
  });
  shadows = [batter].concat(fielders).map(f => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(1.25, 1.05),
      new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false })
    );
    m.rotation.x = -Math.PI / 2;
    m.renderOrder = -1;
    scene.add(m);
    return { fig: f, mesh: m };
  });

  // the flash at the moment of impact
  impactRing = new THREE.Mesh(
    new THREE.RingGeometry(0.04, 0.07, 20),
    new THREE.MeshBasicMaterial({ color: 0xfff2c8, transparent: true, opacity: 0, side: THREE.DoubleSide })
  );
  impactRing.visible = false;
  scene.add(impactRing);
}
let ballShadow, trail, trailPts = [], impactRing, shadows = [];

/* The ground itself: a bowl of seating, a roof line, boards at the rope and
   floodlights. It is all boxes and cylinders — at twenty metres, in a 16-degree
   lens, that is all it ever needs to be. */
function buildGround() {
  const cz = PITCH_LEN / 2;
  const rope = new THREE.Mesh(
    new THREE.TorusGeometry(64, 0.07, 6, 72),
    new THREE.MeshBasicMaterial({ color: 0xe8e2d4 })
  );
  rope.rotation.x = -Math.PI / 2;
  rope.position.set(0, 0.07, cz);
  scene.add(rope);

  // advertising boards just inside the rope
  const boards = new THREE.Mesh(
    new THREE.CylinderGeometry(65.5, 65.5, 0.92, 72, 1, true),
    new THREE.MeshLambertMaterial({ color: 0xffffff, map: boardTexture(), side: THREE.BackSide })
  );
  boards.position.set(0, 0.46, cz);
  scene.add(boards);

  // lower tier, upper tier, and a roof to cap the silhouette
  const crowd = crowdTexture();
  const tier = (r, y, h, tint) => {
    const m = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r, h, 72, 1, true),
      new THREE.MeshLambertMaterial({ color: tint, map: crowd, side: THREE.BackSide })
    );
    m.position.set(0, y, cz);
    scene.add(m);
    return m;
  };
  tier(69, 3.1, 5.0, 0xffffff);
  tier(73, 9.4, 7.4, 0xdfe6ec);
  const roof = new THREE.Mesh(
    new THREE.CylinderGeometry(75, 75, 3.4, 72, 1, true),
    new THREE.MeshLambertMaterial({ color: 0x1a2530, side: THREE.BackSide })
  );
  roof.position.set(0, 14.6, cz);
  scene.add(roof);

  // floodlights
  const pylonMat = new THREE.MeshLambertMaterial({ color: 0x2a343d });
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xf2f6ff });
  for (const a of [0.8, 2.34, 3.94, 5.48]) {
    const x = Math.sin(a) * 71, z = cz + Math.cos(a) * 71;
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 30, 8), pylonMat);
    p.position.set(x, 15, z); scene.add(p);
    const l = new THREE.Mesh(new THREE.BoxGeometry(7, 4.2, 1), lampMat);
    l.position.set(x, 31, z); l.lookAt(0, 0, cz); scene.add(l);
  }

  /* The sightscreen behind the batsman. It stays dark so a red ball reads
     against it, which is the whole reason sightscreens exist — but it is now a
     framed structure sitting in front of the stand rather than a floating black
     rectangle, and it is narrow enough that the ground shows either side. */
  const SCR_W = 13.5, SCR_H = 7.4, SCR_Z = -48;
  const screen = new THREE.Mesh(
    new THREE.PlaneGeometry(SCR_W, SCR_H),
    new THREE.MeshLambertMaterial({ color: 0x16351f })
  );
  screen.position.set(0, SCR_H / 2 + 0.3, SCR_Z);
  scene.add(screen);
  const frameMat = new THREE.MeshLambertMaterial({ color: 0x0f2417 });
  for (const y of [SCR_H + 0.42, 0.18]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(SCR_W + 0.4, 0.26, 0.3), frameMat);
    b.position.set(0, y, SCR_Z + 0.04); scene.add(b);
  }
  for (const x of [-SCR_W / 2 - 0.07, SCR_W / 2 + 0.07]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.28, SCR_H + 0.7, 0.3), frameMat);
    b.position.set(x, SCR_H / 2 + 0.3, SCR_Z + 0.04); scene.add(b);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 1.9), frameMat);
    leg.position.set(x, 0.17, SCR_Z + 0.6); scene.add(leg);
  }
}

function resetCamera() {
  camera.fov = FOV;
  camera.updateProjectionMatrix();
  camera.position.set(0, UMP_Y, UMP_Z);
  camera.lookAt(0, 0.66, 1.4);
}

function line(x, z, w, l) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, l),
    new THREE.MeshBasicMaterial({ color: 0xf0ebe0 })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.016, z);
  scene.add(m);
  return m;
}
function creases(z, dir) {
  line(0, z + CREASE * dir, PITCH_W, 0.05);        // popping crease
  line(0, z, PITCH_W * 0.9, 0.04);                  // bowling crease
  line(-RETURN_X, z + (CREASE * dir) / 2, 0.05, CREASE + 0.3);
  line(RETURN_X, z + (CREASE * dir) / 2, 0.05, CREASE + 0.3);
}

function wicket(z) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xefe6cf });
  const st = [];
  for (const x of [-STUMP_X, 0, STUMP_X]) {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(STUMP_R, STUMP_R, STUMP_H, 10), mat.clone());
    s.position.set(x, STUMP_H / 2, 0);
    g.add(s); st.push(s);
  }
  for (const x of [-STUMP_X / 2, STUMP_X / 2]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(STUMP_X, 0.022, 0.022), mat.clone());
    b.position.set(x, STUMP_H + 0.011, 0);
    g.add(b); st.push(b);
  }
  g.position.z = z;
  scene.add(g);
  return { group: g, parts: st };
}

/* ---------- the bowler ----------
   One bowler bowls the whole over, which is both how cricket works and where a
   lot of the judgement comes from: once you know it is a left-armer going
   round the wicket, the angle is part of every decision you make.

   Release point. A right-armer bowling over the wicket has his arm above the
   stumps and his body on the off side, so he releases from about 35cm to the
   off. Round the wicket he crosses over and releases from the leg side, and
   because the ball then starts outside leg, "pitched outside leg" comes into
   play far more often. Left-armers are the mirror of both. */
const HANDS = ['right', 'right', 'right', 'left'];
function makeBowler() {
  const hand = pick(HANDS);
  const style = pick(['fast', 'fast', 'medium', 'medium', 'spin', 'spin']);
  const around = rng() < (style === 'spin' ? 0.34 : 0.22);
  const sgn = hand === 'right' ? 1 : -1;
  const relX = (around ? 0.55 : -0.36) * sgn;

  /* Which way it moves. For a right-arm finger spinner (off-spin) the ball
     turns from off to leg — into the right-hander, toward +X. Wrist spin goes
     the other way. Seam bowlers get swing instead, named the same way round. */
  const wrist = style === 'spin' ? rng() < 0.38 : false;
  const turnSgn = style === 'spin' ? (wrist ? -1 : 1) * sgn : 0;
  const swingSgn = rng() < 0.5 ? 1 : -1;

  const label =
    (hand === 'right' ? 'RIGHT-ARM ' : 'LEFT-ARM ') +
    (style === 'spin' ? (wrist ? 'WRIST SPIN' : 'OFF SPIN') : style === 'fast' ? 'FAST' : 'MEDIUM') +
    (around ? ' · ROUND THE WICKET' : ' · OVER THE WICKET');

  const movement = style === 'spin'
    ? (turnSgn > 0 ? 'turning in' : 'turning away')
    : (swingSgn > 0 ? 'swinging in' : 'swinging away');

  /* Some bowlers extract more from the same pitch than others — height,
     wrist position, how hard they hit the deck. It applies to the whole over,
     so the bounce has a character rather than being noise ball to ball. */
  const bounceTrait = rng() < 0.30 ? rnd(1.10, 1.24) : rng() < 0.30 ? rnd(0.80, 0.92) : 1;
  return { hand, style, around, relX, wrist, turnSgn, swingSgn, label, movement, bounceTrait };
}

/* ---------- deliveries, in metres ---------- */
/* The worn patch outside the right-hander's off stump, in metres from his own
   stumps. The pitch texture draws exactly this rectangle, so what you see is
   what the ball reacts to. */
const ROUGH = { x0: -0.70, x1: -0.20, z0: 3.80, z1: 6.80 };

const LENGTHS = {
  YORKER: [0.35, 1.30],
  FULL:   [2.40, 4.40],
  GOOD:   [5.40, 8.00],
  SHORT:  [7.40, 9.80]
};
const LEN_NAME = { YORKER: 'YORKER', FULL: 'FULL', GOOD: 'GOOD LENGTH', SHORT: 'SHORT' };
const LEN_PICK = { spin: ['GOOD', 'GOOD', 'FULL', 'SHORT'], pace: ['GOOD', 'GOOD', 'FULL', 'SHORT', 'SHORT', 'YORKER'] };
/* Mean commitment by length, and how far in front of his stumps he can be
   struck at the two extremes of it. A good length is deliberately a coin flip. */
const COMMIT = { FULL: 0.74, GOOD: 0.45, SHORT: 0.24 };
const REACH  = { FULL: [0.74, 2.06], GOOD: [0.42, 1.98], SHORT: [0.34, 1.34] };
/* How much of its downward speed the ball keeps when it bounces. This is the
   one number that decides everything about height, and it replaces a table of
   hand-written impact heights — see makeDelivery. A cricket ball off a normal
   pitch comes back at a bit over half its downward velocity; a dead, low pitch
   less, a hard bouncy one more. */
const REST = { low: [0.36, 0.47], normal: [0.51, 0.63], steep: [0.70, 0.86] };

function makeDelivery(B, forceLen) {
  const type = B.style;
  const relY = REL_Y + rnd(-0.12, 0.10);
  const mph = type === 'fast' ? Math.round(rnd(86, 97))
            : type === 'medium' ? Math.round(rnd(72, 84))
            : Math.round(rnd(44, 60));
  const v = mph * 0.44704;                       // m/s

  // a spinner drops it into the rough on purpose about a quarter of the time
  const aimRough = type === 'spin' && rng() < 0.28;
  const lenKind = aimRough ? 'GOOD' : (forceLen || pick(LEN_PICK[type === 'spin' ? 'spin' : 'pace']));
  const pz = aimRough ? rnd(ROUGH.z0 + 0.3, ROUGH.z1 - 0.3) : rnd(...LENGTHS[lenKind]);

  /* Where it pitches across the strip. A bowler going round the wicket is
     starting from the other side and naturally lands straighter or leg-side,
     which is where most "pitched outside leg" reprieves come from. */
  const bias = B.around ? (B.hand === 'right' ? 0.110 : -0.085) : 0;
  const px = aimRough ? rnd(ROUGH.x0 + 0.05, ROUGH.x1 - 0.05)
    : rng() < 0.12
      ? rnd(0.06, 0.34)                                  // a deliberate leg-side line
      : clamp(-0.06 + bias + gauss() * 0.105, -0.50, 0.34);

  /* Deviation off the pitch. A spinner turns his own way most of the time, with
     the occasional one that holds its line or goes the other way; a seamer just
     nibbles, except when it doesn't. */
  const straightOn = rng() < 0.18;
  /* The rough. Both bowlers' follow-throughs have scuffed a patch outside the
     right-hander's off stump about four to seven metres from his stumps, and it
     is drawn on the pitch where you can see it. Land in it and the ball does
     something violent — which is the whole point of a spinner bowling there, and
     means an alert umpire can see a big turner coming before it lands. */
  const inRough = px > ROUGH.x0 && px < ROUGH.x1 && pz > ROUGH.z0 && pz < ROUGH.z1;
  /* Landed on a crack. The cracks are drawn on the pitch from the same data, so
     the umpire can see where the ball pitched and know why it did what it did.
     A crack does two things a real one does: the bounce goes wrong — shoots
     through low or kicks — and the ball can jag off the edge sideways, either
     way, regardless of what the bowler was trying to do. */
  const offCrack = nearCrack(px, pz);
  let dev = type === 'spin'
    ? (straightOn ? gauss() * 0.06
                  : B.turnSgn * (rng() < 0.30 ? rnd(0.48, 1.00) : rnd(0.16, 0.46)))
    : (rng() < 0.20 ? B.swingSgn * rnd(0.20, 0.46) : gauss() * 0.085);
  if (inRough) dev *= type === 'spin' ? rnd(1.5, 2.2) : rnd(1.2, 1.6);

  /* Swing through the air. This is the shape of the flight, not the landing
     point: the ball leaves on one line and arrives on another. */
  const swing = type === 'spin' ? rnd(-0.10, 0.10)
              : B.swingSgn * (rng() < 0.42 ? rnd(0.58, 1.20) : rnd(0.08, 0.46));

  // does he play at it? leaving is rarer than playing
  const shot = rng() < 0.82;
  /* HOW FAR FORWARD HE COMMITS.
